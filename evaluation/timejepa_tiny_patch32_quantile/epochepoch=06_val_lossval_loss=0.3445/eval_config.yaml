model:
  name: timejepa_tiny_patch32_quantile
  seq_length: 512
  patch_length: 32
  stride: 16
  num_channels: 1
  prediction_length: 128
  encoder:
    d_model: 128
    n_heads: 4
    n_layers: 3
    d_ff: 512
    dropout: 0.1
    activation: gelu
    use_revin: true
    use_rope: true
    norm_first: true
  predictor:
    type: transformer
    d_model: 128
    n_heads: 4
    n_layers: 2
    d_ff: 512
    dropout: 0.1
    activation: gelu
  decoder:
    type: quantile
    d_model: 128
    hidden_dim: 256
    n_layers: 4
    dropout: 0.1
  target_encoder:
    momentum_schedule: cosine
    momentum_base: 0.996
    momentum_final: 1.0
  params_millions: ~1.6
training:
  mode: pretrain
  finetune_mode: gradual_unfreeze
  unfreeze_after_epoch: 1
  contextualized_targets: true
  context_lengths:
  - 128
  - 192
  - 256
  - 320
  - 384
  - 448
  - 512
  p_random_context: 0.5
  horizon_lengths:
  - 64
  - 96
  - 128
  p_random_horizon: 0.5
  loss:
    type: vicreg
    finetune_type: huber
    smooth_l1_beta: 1.0
    invariance_loss_weight: 25.0
    variance_loss_weight: 15.0
    covariance_loss_weight: 1.0
    sigreg:
      lambda: 1.0
      apply_to: context
      num_projections: 16
      num_quadrature: 33
      t_max: 5.0
      max_tokens: 8192
    regularize_context: true
  optimizer:
    name: adamw
    learning_rate: 0.00075
    weight_decay: 0.02
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    encoder_lr_multiplier: 1.0
  lr_scheduler:
    type: cosine
    warmup_epochs: 0.1
    min_lr: 1.0e-06
  max_epochs: 40
  ema:
    enabled: true
    momentum_base: 0.998
    momentum_final: 1.0
    schedule: cosine
  dropout: 0.05
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  log_histograms: false
data:
  data_dir: data/processed/
  checkpoint_dir: checkpoints/
  output_dir: lightning/
  datasets:
  - electricity-hourly
  - traffic-hourly
  - rain-temperature
  - weather
  - weather
  - australian-weather
  - m4-hourly
  - australian-electricity-demand
  - electricity-demand
  - bitcoin
  - kdd-cup-2018
  - saugeenday
  - solar-power-4-seconds
  - sunspot-daily
  - solar-10-minute-dataset
  - us-births
  - windpower-4-seconds
  - nn5-daily
  - melbourne-pedestrian-count
  - wikipedia-web-traffic-weekly
  - london-smart-meters
  - fred-md
  - wind-farms-minutely
  - rideshare
  datasets_finetune: ${data.datasets}
  datasets_eval:
  - electricity-hourly
  - traffic-hourly
  - m4-hourly
  - london-smart-meters
  - wikipedia-web-traffic-extended
  - melbourne-pedestrian-count
  - bitcoin
  - nn5-daily
  - solar-10-minute-dataset
  - saugeenday
  combine_mode: concatenate
  batch_size: 512
  stride: 8
  normalize_mode: global
  normalizer_type: identity
  clip_outliers: false
  clip_sigma: 5.0
  balanced_sampling: true
  sampling_temperature: 0.5
  max_oversample_ratio: 6.0
  train_val_test_split:
  - 0.96
  - 0.02
  - 0.02
  seed: 420
  multi_resolution_factors:
  - 1
  - 2
  - 3
  - 4
  p_multi_resolution: 0.35
  num_workers: 4
  persistent_workers: false
nixtla:
- ettm1
- ettm2
- etth1
- etth2
- electricity
- ecl
- exchange
- traffic
- ili
- weather
horizons:
- 96
- 192
- 336
- 720
augmentations:
  pretrain:
    enabled: true
    scale_enabled: true
    scale_range:
    - 0.8
    - 1.4
    scale_log_uniform: true
    p_scale: 0.5
    jitter_enabled: true
    jitter_std: 0.015
    jitter_relative: true
    p_jitter: 0.15
    magnitude_warp_enabled: true
    magnitude_warp_sigma: 0.2
    magnitude_warp_knots: 4
    p_magnitude_warp: 0.3
    drs_enabled: true
    drs_factors:
    - 2
    - 3
    - 4
    drs_interpolation: linear
    p_drs: 0.15
    trend_enabled: false
  finetune:
    enabled: true
    scale_enabled: true
    scale_range:
    - 0.9
    - 1.15
    p_scale: 0.3
    jitter_enabled: true
    jitter_std: 0.01
    p_jitter: 0.1
    magnitude_warp_enabled: false
    drs_enabled: false
    trend_enabled: false
checkpoint:
  monitor: val_loss
  mode: min
  save_top_k: 3
  save_last: true
  filename: epoch{epoch:02d}_val_loss{val_loss:.4f}
  auto_insert_metric_name: false
early_stopping:
  enabled: true
  monitor: val_loss
  patience: 25
  mode: min
  min_delta: 0.0001
trainer:
  accelerator: auto
  devices: -1
  precision: bf16-mixed
  max_epochs: ${training.max_epochs}
  gradient_clip_val: ${training.gradient_clip_val}
  accumulate_grad_batches: 3
  val_check_interval: 0.1
  limit_val_batches: 300
  limit_train_batches: null
  log_every_n_steps: ${training.log_every_n_steps}
  deterministic: false
  strategy: ddp_find_unused_parameters_true
  enable_progress_bar: true
  enable_model_summary: true
  use_distributed_sampler: false
wandb:
  project: TimeJEPA
  entity: iuseamouse
  run_name: null
  tags:
  - tiny
  - jepa_tst
  - experiment
  - patch32
  - quantile-head
  log_model: true
  log_gradients: false
  log_freq: 100
checkpoint_path: checkpoints/timejepa_tiny_patch32_quantile/pretrain_False/epochepoch=06_val_lossval_loss=0.3445.ckpt
