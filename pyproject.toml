[project]
name = "timejepa"
version = "0.1.0"
description = "Time Series Joint Embedding Predictive Architecture Research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # NOTE: this constraint says nothing about the CUDA build variant. On a host
    # whose driver is older than the CUDA the default wheel was compiled against,
    # torch fails at init with "The NVIDIA driver on your system is too old".
    # Rented GPUs (RunPod, Colab) have a host-fixed driver you cannot upgrade, so
    # install a matching build instead:
    #   uv pip install --force-reinstall torch --index-url https://download.pytorch.org/whl/cu128
    # Reference version for this repo (what the test suite runs on): 2.9.1+cu128.
    # See PLAN.md > "Pièges d'environnement".
    "torch>=2.8.0",
    "pytorch-lightning>=2.5.0",
    "numpy>=2.3.0",
    "pandas>=2.2.0",
    "scipy>=1.15.0",
    "einops>=0.7.0",          
    "mlflow>=3.5.0",           
    "sktime>=0.38.0",           
    "requests>=2.31.0",        
    "tqdm>=4.67.0",
    "loguru>=0.7.0",  
    "pytest>=9.0.0",
    "hydra-core>=1.3.0",
    "wandb>=0.22.0",
    "datasetsforecast==1.0.0",
    # Corpus LOTSA (scripts/prepare_lotsa.py) : lecture en streaming depuis
    # HuggingFace. Dépendances de base et non optionnelles — le coût d'install
    # ne justifie pas la complexité d'un import conditionnel.
    "datasets>=3.0.0",
    "huggingface-hub>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "jupyterlab",
    "matplotlib",
]
# Proposeur TTM-R3 des expériences hybrides (scripts/evaluate_energy.py,
# scripts/evaluate_gift_hybrid.py). Fournit le module `tsfm_public` et tire
# transformers — volumineux, donc optionnel : le harnais officiel n'en a
# pas besoin. Install : uv pip install -e ".[ttm]"
ttm = [
    "granite-tsfm>=0.2",
]
cluster = [
    "deepspeed",        
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timejepa"]