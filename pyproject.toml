[project]
name = "timejepa"
version = "0.1.0"
description = "Time Series Joint Embedding Predictive Architecture Research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.8.0",
    "pytorch-lightning>=2.5.0",
    "numpy>=2.3.0",
    "pandas>=2.2.0",
    "scipy>=1.15.0",
    "einops>=0.7.0",          
    "mlflow>=3.5.0",           
    "sktime>=0.38.0",           
    "requests>=2.31.0",        
    "tqdm>=4.67.0",
    "loguru>=0.7.0",  
    "pytest>=9.0.0",
    "hydra-core>=1.3.0"          
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "jupyterlab",
    "matplotlib",
]
cluster = [
    "deepspeed",        # Optionnel en local, requis sur cluster
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timejepa"]