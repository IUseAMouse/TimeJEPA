# @package _global_

training:
  mode: "finetune"
  
  # Pretrained model
  pretrained_encoder_path: null  # Path to pretrained encoder checkpoint
  
  # Finetuning strategy
  finetune_mode: "full_finetune"  # linear_probe | full_finetune | gradual_unfreeze
  unfreeze_after_epoch: 5  # For gradual_unfreeze mode
  
  # Loss configuration
  loss:
    type: "mse"  # mse | mae | huber
    huber_delta: 1.0
  
  # Multi-horizon (optional)
  multi_horizon:
    enabled: false
    prediction_horizons: [24, 48, 96, 192]
    horizon_weights: [1.0, 1.0, 1.0, 1.0]
  
  # Optimization
  optimizer:
    name: "adamw"
    learning_rate: 1.0e-4
    encoder_lr_multiplier: 0.1  # Lower LR for pretrained encoder
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
  
  # Learning rate schedule
  lr_scheduler:
    type: "cosine"  # cosine | linear | plateau | constant
    warmup_epochs: 5
    min_lr: 1.0e-6
    plateau_patience: 5
    plateau_factor: 0.5
  
  # Training duration
  max_epochs: 50
  
  # Regularization
  dropout: 0.1
  gradient_clip_val: 1.0
  label_smoothing: 0.0
  
  # Logging
  log_every_n_steps: 10
  log_predictions: true  # Log prediction samples
  num_prediction_samples: 4