# configs/training/finetune_benchmark.yaml
training:
  stage: "finetune"
  
  # Fixed lengths for benchmark evaluation
  context_length: 512
  prediction_length: 96
  
  # Benchmark-specific (can override per dataset)
  benchmark:
    name: "ett_h1"  # or "electricity", "traffic", etc.
    horizons: [96, 192, 336, 720]  # Standard benchmarks
  
  # Generative loss (pixel-space)
  loss: "mse"  # or "mae", "smooth_l1"
  
  # Load pretrained JEPA
  load_from_checkpoint: "checkpoints/jepa_pretrain_best.ckpt"
  freeze_encoder: false  # Fine-tune everything
  freeze_target_encoder: true  # Don't need this for finetuning
  
  # Optimizer (lower LR for finetuning)
  optimizer: "adamw"
  lr: 5e-5  # Lower than pretrain
  weight_decay: 0.01
  
  # Training
  epochs: 20  # Fewer epochs for finetuning
  batch_size: 128
  gradient_clip: 1.0
  
  # Validation
  val_every_n_epochs: 1
  patience: 5