# @package _global_

training:
  mode: "pretrain"
  
  # Masking strategy
  masking:
    strategy: "temporal"  # random | block | temporal | random_temporal
    context_ratio: 0.7
    n_context_blocks: 4
    context_block_length: 3
    n_target_blocks: 2
    target_block_length: 3
    scale: [0.15, 0.25]  # Min/max scale for random masking
  
  # Loss configuration
  loss:
    type: "mse"  # mse | smooth_l1 | cosine
    smooth_l1_beta: 1.0
    variance_loss_weight: 0.0
    covariance_loss_weight: 0.0
  
  # Optimization
  optimizer:
    name: "adamw"
    learning_rate: 1.0e-3
    weight_decay: 0.05
    betas: [0.9, 0.95]
    eps: 1.0e-8
  
  # Learning rate schedule
  lr_scheduler:
    type: "cosine"  # cosine | linear | constant
    warmup_epochs: 10
    min_lr: 1.0e-6
  
  # Training duration
  max_epochs: 200
  
  # EMA configuration
  ema:
    enabled: true
    momentum_base: 0.996
    momentum_final: 1.0
    schedule: "cosine"
  
  # Regularization
  dropout: 0.1
  gradient_clip_val: 1.0
  
  # Logging
  log_every_n_steps: 50
  log_histograms: false  # Log weight histograms (expensive)