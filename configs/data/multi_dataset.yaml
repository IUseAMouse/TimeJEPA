# @package _global_

data:
  data_dir: "data/processed"
  datasets: ["electricity", "weather", "m4_hourly"]  # Specific list
  
  combine_mode: "concatenate"  # Train on all combined
  
  seq_length: 512
  prediction_length: 96
  stride: 1
  
  split_mode: "ratio"
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  
  normalization:
    type: "standard"
    per_channel: true
    fit_on_train_only: true
  
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  shuffle_train: true 