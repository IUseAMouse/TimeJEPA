# @package _global_
#
# Experiment: finetune on all datasets instead of the curated 8.
#
# Run this against a `tiny_patch32` finetune from the same pretrain
# checkpoint. Only `datasets_finetune` differs.
#
# Why: the default finetune set is 8 of 24, all "clean seasonal"
# (electricity, traffic, weather, australian-weather, m4-hourly,
# australian-electricity-demand, electricity-demand,
# melbourne-pedestrian-count). It excludes every noisy or non-stationary
# series, so the decoder is trained on the regime where the model already
# wins and then evaluated on ETTm1 and exchange where it loses. This tests
# whether that curation is part of the problem.
#
# Interpolated from data.datasets so it cannot drift out of sync with the
# pretrain list. Datasets too short for the context (wikipedia-web-traffic-weekly
# at 114 timesteps, rideshare at 541) are skipped automatically with a warning.
#
# Before comparing results: `datasets_eval` (the local Monash evaluation)
# overlaps with the finetune set. With finetune=all, 9 of its 10 datasets
# become in-distribution for this arm while remaining held-out for the
# baseline arm (already in the curated 8: electricity-hourly, traffic-hourly,
# m4-hourly, melbourne-pedestrian-count; held-out until now:
# london-smart-meters, bitcoin, nn5-daily, solar-10-minute-dataset,
# saugeenday). Judge this arm on the Nixtla benchmark, which no Monash
# finetune touches.
#
# Even there, Nixtla's `electricity` (ECL) and `traffic` share their source
# with Monash `electricity-hourly` and `traffic-hourly`, which are in both
# pretrain and finetune; those two columns are not zero-shot for any run.
# ETTm1, ETTm2, ETTh1, ETTh2 and exchange are clean.
defaults:
  - tiny_patch32
  - _self_

model:
  name: "timejepa_tiny_patch32_ftall"

data:
  datasets_finetune: ${data.datasets}

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "patch32"
    - "finetune-all-datasets"
