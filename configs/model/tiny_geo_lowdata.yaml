# @package _global_
#
# Transfer to unseen data, pretrained arm.
# Twin config: tiny_geo_scratch_lowdata (identical, without pretrained weights).
#
#   python scripts/train.py --config-name tiny_geo_lowdata \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_tiny_geo/pretrain_True/<ckpt>"' \
#       wandb.run_name=lowdata-pretrained
#
# The checkpoint path is the only element to supply by hand. Without it,
# this run becomes a duplicate of the scratch arm.
#
# Why: pretrained and scratch tied with the full finetune corpus (mean MASE
# 1.193 vs 1.187) because the pretrain corpus and the finetune corpus were
# the same 24 datasets; pretraining then reduces to an initialization. A
# foundation model's value is transferring to data it has never seen.
#
# The corpus: the tiny_geo pretrain requires a window of 1024+256 = 1280
# steps, so six datasets from `data.datasets` are dropped at load time by
# the length filter and the encoder never saw them:
#
#   m4-hourly            1008 steps  <- kept here
#   nn5-daily             791 steps  <- kept here (daily frequency, nearly
#                                      absent from the sub-daily corpus)
#   fred-md               728 steps  (excluded here: < 768, monthly macro)
#   rain-temperature      725 steps  (excluded here: < 768)
#   rideshare             541 steps  (excluded)
#   wikipedia-weekly      114 steps  (excluded)
#
# The pretrain log line "6/23 dataset(s) skipped (1280 timesteps required)"
# lists exactly these six. The held-out corpus is a side effect of the
# pretrain geometry, not a hand-written exclusion.
#
# 4-dataset variant, if diversity is preferred over context:
#   model.seq_length=384 'data.datasets_finetune=[m4-hourly,nn5-daily,fred-md,rain-temperature]'
# (384+256 = 640 <= 725). Brings in monthly macro and climate at the cost of
# a shorter context for both arms. rain-temperature brings 32,072 series, so
# the experiment stops being "low data" and becomes purely "unseen data".
#
# Geometry: seq_length 512 (instead of 1024) because m4-hourly is only 1008
# steps; 512 + 256 = 768 <= 791 brings in m4-hourly and nn5-daily. 512 is
# within the range seen at pretrain (128 to 1024), so the pretrained arm is
# not out of distribution. Side effect: ~12k training windows versus ~8M
# for the full corpus, so the experiment is both "unseen data" and "low data".
#
# Budget: max_epochs 200 (an epoch is tiny here), early stopping patience 25.
# Both arms get the same budget; if the scratch arm stops early, give it
# more epochs before concluding.
#
# Secondary axis: `data.stride` (default 8) sets the window sampling density;
# raising it (128, 512) on both arms traces a performance-vs-volume curve.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_geo_lowdata"
  seq_length: 512

training:
  mode: "finetune"
  # gradual_unfreeze would freeze the encoder during the first epoch, which
  # makes no sense for the scratch twin (random weights). Both arms share
  # the mode.
  finetune_mode: "full_finetune"
  max_epochs: 200
  # The tiny_geo list goes up to 1024; at seq_length 512 the larger lengths
  # would never be eligible.
  context_lengths: [128, 192, 256, 384, 512]

data:
  # The two datasets the pretrain could not have seen that fit in 768 steps.
  datasets_finetune: ["m4-hourly", "nn5-daily"]

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "lowdata"
    - "held-out"
    - "pretrained"
