# @package _global_
#
# G4.6 — TRANSFERT VERS DES DONNÉES INÉDITES, arm PRÉ-ENTRAÎNÉ.
# Config jumelle : tiny_geo_scratch_lowdata (identique, sans poids pré-entraînés).
#
#   python scripts/train.py --config-name tiny_geo_lowdata \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_tiny_geo/pretrain_True/<ckpt>"' \
#       wandb.run_name=lowdata-pretrained
#
# ⚠️ Le chemin du checkpoint est le SEUL élément à fournir à la main. S'il manque,
# ce run devient un doublon du scratch et l'expérience ne mesure rien.
#
# Pourquoi cette expérience
# -------------------------
# E8 a mesuré une ÉGALITÉ entre pré-entraîné et scratch à corpus de finetune
# complet (MASE moyenne 1.193 vs 1.187). Ce résultat ne réfute pas le pari du
# projet, et ne POUVAIT pas le faire : le corpus de pretrain et celui de finetune
# étaient LES MÊMES 24 datasets. Quand les deux coïncident, le modèle supervisé
# voit exactement les mêmes octets, le pretraining se réduit à une initialisation,
# et l'égalité est le résultat par défaut. La trajectoire l'a confirmé — départ
# plus rapide pour le pré-entraîné, écart refermé à ~10k steps.
#
# La valeur d'un modèle de fondation est de transférer vers des données qu'il n'a
# jamais vues. C'est ce que teste cette config.
#
# Le corpus : ce que le pretrain n'a PAS pu voir
# ----------------------------------------------
# Le pretrain tiny_geo exige une fenêtre de 1024+256 = 1280 pas. SIX datasets de
# `data.datasets` sont donc écartés à la source par le filtre de longueur (B17) —
# l'encodeur ne les a JAMAIS vus, pas même partiellement :
#
#   m4-hourly            1008 pas   <- retenu ici
#   nn5-daily             791 pas   <- retenu ici (et fréquence QUOTIDIENNE,
#                                      quasi absente du corpus sous-quotidien)
#   fred-md               728 pas   (exclu ici : < 768 — macro MENSUELLE)
#   rain-temperature      725 pas   (exclu ici : < 768)
#   rideshare             541 pas   (exclu)
#   wikipedia-weekly      114 pas   (exclu)
#
# ✅ VÉRIFIÉ sur le log du pretrain tiny_geo (2026-08-10) :
#   "6/23 dataset(s) skipped (1280 timesteps required)" liste exactement ces six.
# Ils figurent bien dans `data.datasets`, mais le filtre de longueur (B17) les
# écarte AU CHARGEMENT — 0 fenêtre créée, l'encodeur ne les a jamais vus. C'est
# ce qui rend l'expérience possible : le corpus held-out est un effet de bord de
# la géométrie du pretrain, pas une exclusion à écrire à la main.
#
# Variante à 4 datasets, si l'on préfère la DIVERSITÉ au contexte
# ---------------------------------------------------------------
#   model.seq_length=384 'data.datasets_finetune=[m4-hourly,nn5-daily,fred-md,rain-temperature]'
# (384+256 = 640 <= 725, tout passe). Fait entrer la macro mensuelle et le
# climatique — quatre régimes au lieu de deux. Coût : contexte plus court, donc
# pénalité pour les DEUX arms (comparaison appariée, donc lecture préservée).
# ⚠️ Change aussi le régime : rain-temperature apporte 32 072 séries, l'expérience
# cesse alors d'être « peu de données » et devient purement « données inédites ».
#
# La géométrie suit du corpus
# ---------------------------
# seq_length 512 (au lieu de 1024) parce que m4-hourly ne fait que 1008 pas :
# 512 + 256 = 768 <= 791 fait entrer m4-hourly ET nn5-daily. Passer à 640 ne
# garderait que m4-hourly ; descendre à 384 ferait entrer rain-temperature mais
# à un contexte que le balayage (E7/E9) montre pénalisant.
# 512 est dans la plage vue au pretrain (context_lengths va de 128 à 1024), donc
# l'arm pré-entraîné n'est pas hors distribution — c'est bien le TRANSFERT DE
# DONNÉES qui est testé, pas une extrapolation de géométrie.
#
# Effet de bord voulu : ~12 k fenêtres d'entraînement contre ~8 M pour le corpus
# complet. L'expérience est donc à la fois « données inédites » ET « peu de
# données » — les deux régimes où le SSL doit payer s'il vaut quelque chose.
#
# Budget d'entraînement
# ---------------------
# max_epochs 200 : une époque est ici minuscule. L'early stopping (patience 25)
# coupe quand ça ne progresse plus. Les DEUX arms ont le même budget — condition
# pour que le résultat prouve quelque chose. Si le scratch s'arrête tôt, lui
# redonner des époques avant de conclure.
#
# Axe secondaire, si le résultat est ambigu
# -----------------------------------------
# `data.stride` (défaut 8) règle la densité d'échantillonnage des fenêtres et
# donc le volume, à corpus constant. Le monter (128, 512) sur les DEUX arms trace
# une courbe performance-vs-volume : la figure naturelle pour cette question.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_geo_lowdata"
  seq_length: 512

training:
  mode: "finetune"
  # Obligatoire : gradual_unfreeze gèlerait l'encodeur pendant la première époque,
  # ce qui n'a aucun sens pour le jumeau scratch (poids aléatoires). Les deux arms
  # doivent partager le mode.
  finetune_mode: "full_finetune"
  max_epochs: 200
  # La liste de tiny_geo monte à 1024 ; à seq_length 512 les longueurs supérieures
  # ne seraient de toute façon jamais éligibles. Explicité pour que le log
  # geometry/context_len reste lisible.
  context_lengths: [128, 192, 256, 384, 512]

data:
  # Les DEUX datasets que le pretrain n'a pas pu voir et qui tiennent dans 768 pas.
  datasets_finetune: ["m4-hourly", "nn5-daily"]

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "lowdata"
    - "held-out"
    - "pretrained"
