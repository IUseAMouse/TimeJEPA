# @package _global_
#
# G5 - ZERO-SHOT EVALUATION, mini scale.
#
#   python scripts/evaluate.py --config-name lotsa_mini_eval \
#       +checkpoint_path=checkpoints/timejepa_lotsa_mini_zs/pretrain_False/<ckpt>
#
# Geometry and capacity of the trained model, but EVALUATION data (Monash
# corpus). Neither `lotsa_mini` nor `lotsa_mini_zeroshot` fits: their
# `data_dir` points to LOTSA, so the "local datasets" section would run on
# the training corpus.
#
# WARNING - as for `lotsa_tiny_eval`: the "Nixtla" section is fully
# zero-shot, the "Local datasets" section is not for seven entries
# (london-smart-meters, bitcoin, wind-farms-minutely, rideshare, fred-md,
# sunspot-daily, melbourne-pedestrian-count) which have a KEPT equivalent in
# LOTSA. The Nixtla numbers are the publishable ones.
#
# A test locks the identity of geometry AND capacity with
# `lotsa_mini_zeroshot`: at evaluation an incompatible shape only WARNS
# before outputting silently wrong numbers.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_lotsa_mini_zs"
  encoder:
    d_model: 192
    n_heads: 6
    n_layers: 4
    d_ff: 768
  predictor:
    d_model: 192
    n_heads: 6
    n_layers: 3
    d_ff: 768
  decoder:
    d_model: 192
    hidden_dim: 384
    n_layers: 4

wandb:
  tags:
    - "mini"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "zeroshot"
    - "eval"
