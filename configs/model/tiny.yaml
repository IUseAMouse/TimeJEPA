# @package _global_

model:
  name: "timejepa_tiny"
  
  # Input configuration
  seq_length: 384
  patch_length: 16
  stride: 8
  num_channels: 1
  prediction_length: 96
  
  # Encoder architecture
  encoder:
    d_model: 128
    n_heads: 4
    n_layers: 3
    d_ff: 512
    dropout: 0.1
    activation: "gelu"
    use_revin: true
    use_rope: true
    norm_first: true
  
  # Predictor architecture
  predictor:
    type: "transformer"  # transformer | mlp
    d_model: 128
    n_heads: 4
    n_layers: 3
    d_ff: 512
    dropout: 0.1
    activation: "gelu"
  
  # Decoder architecture
  decoder:
    type: "mlp"  # linear | mlp | attentive
    d_model: 128
    hidden_dim: 256
    n_layers: 4
    dropout: 0.1
  
  # Target encoder (EMA)
  target_encoder:
    momentum_schedule: "cosine"
    momentum_base: 0.996
    momentum_final: 1.0
  
  # Model size stats
  params_millions: ~1.6  # Approximate

training:
  mode: "pretrain"
  
  # Loss configuration
  loss:
    type: "vicreg"  # mse | smooth_l1 | cosine | vicreg
    finetune_type: "huber"
    smooth_l1_beta: 1.0
    variance_loss_weight: 0.0
    covariance_loss_weight: 0.0
  
  # Optimization
  optimizer:
    name: "adamw"
    learning_rate: 1.0e-4
    weight_decay: 0.02
    betas: [0.9, 0.95]
    eps: 1.0e-8
    encoder_lr_multiplier: 1.00
  
  # Learning rate schedule
  lr_scheduler:
    type: "cosine"  # cosine | linear | constant
    warmup_epochs: 0.1
    min_lr: 1.0e-6
  
  # Training duration
  max_epochs: 40
  
  # EMA configuration
  ema:
    enabled: true
    momentum_base: 0.998
    momentum_final: 1.0
    schedule: "cosine"
  
  # Regularization
  dropout: 0.05
  gradient_clip_val: 1.0
  
  # Logging
  log_every_n_steps: 50
  log_histograms: false  # Log weight histograms (expensive)

data:
  data_dir: "data/processed/"
  checkpoint_dir: "checkpoints/"
  output_dir: "lightning/"
  datasets: [] # This load alls
  datasets_finetune: ["traffic"]
  combine_mode: "concatenate"
  batch_size: 256
  stride: 32
  normalize_mode: "global"
  normalizer_type: "identity"
  train_val_test_split: [0.96, 0.02, 0.02]
  seed: 420

checkpoint:
  monitor: "val_loss"
  mode: "min"
  save_top_k: 3
  save_last: true
  filename: "epoch={epoch:02d}-val_loss={val_loss:.4f}"
  auto_insert_metric_name: false

early_stopping:
  enabled: false
  monitor: "val_loss"
  patience: 15
  mode: "min"
  min_delta: 0.0001

trainer:
  accelerator: "auto"  # auto | cpu | gpu | tpu
  devices: 1  # Number of devices to use
  precision: "bf16-mixed"  # 32-true | 16-mixed | bf16-mixed
  max_epochs: ${training.max_epochs}  # Reference from training section
  gradient_clip_val: ${training.gradient_clip_val}  # Reference from training
  accumulate_grad_batches: 6  # Gradient accumulation steps
  val_check_interval: 0.1  # Validate every epoch (1.0) or every N steps (int)
  log_every_n_steps: ${training.log_every_n_steps}  # Reference from training
  deterministic: false  # Set to true for reproducibility (slower)
  enable_progress_bar: true
  enable_model_summary: true

wandb:
  project: "TimeJEPA"
  entity: "iuseamouse"
  run_name: null  # Auto-generated
  tags:
    - "tiny"
    - "jepa_tst"
    - "v1"
    - "pytorch-lightning"
  log_model: true  # Log checkpoints
  log_gradients: false  # Log gradients (expensive)
  log_freq: 100  # Gradient logging frequency