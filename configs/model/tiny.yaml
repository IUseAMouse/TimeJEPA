# @package _global_

model:
  name: "timejepa_tiny"
  
  # Input configuration
  seq_length: 512
  patch_length: 16
  stride: 8
  num_channels: 1
  prediction_length: 128
  
  # Encoder architecture
  encoder:
    d_model: 128
    n_heads: 4
    n_layers: 3
    d_ff: 512
    dropout: 0.1
    activation: "gelu"
    use_revin: true
    use_rope: true
    norm_first: true
  
  # Predictor architecture
  predictor:
    type: "transformer"  # transformer | mlp
    d_model: 128
    n_heads: 4
    n_layers: 2
    d_ff: 512
    dropout: 0.1
    activation: "gelu"
  
  # Decoder architecture
  decoder:
    type: "mlp"  # linear | mlp | attentive
    d_model: 128
    hidden_dim: 256
    n_layers: 4
    dropout: 0.1
  
  # Target encoder (EMA)
  target_encoder:
    momentum_schedule: "cosine"
    momentum_base: 0.996
    momentum_final: 1.0
  
  # Model size stats
  params_millions: ~1.6

training:
  mode: "pretrain"
  finetune_mode: "gradual_unfreeze"
  unfreeze_after_epoch: 1

  # I-JEPA-style targets: encode [context, target] with the EMA encoder and
  # slice the target positions. Encoding the future window alone gave the
  # target encoder ~11 patches while the online encoder saw ~47, a distribution
  # shift between the two networks of an EMA pair.
  contextualized_targets: true

  # Input-geometry randomization, sampled once per batch (keeps tensors
  # rectangular; the encoder is length-agnostic thanks to RoPE). With a fixed
  # context, skill peaked at the training length and collapsed either side.
  context_lengths: [128, 192, 256, 320, 384, 448, 512]
  p_random_context: 0.5
  horizon_lengths: [32, 64, 96, 128]
  p_random_horizon: 0.5
  
  # Loss configuration
  loss:
    type: "vicreg"  # mse | smooth_l1 | cosine | vicreg | sigreg
    finetune_type: "huber" # mse | mae | huber
    smooth_l1_beta: 1.0

    # --- VICReg ---
    invariance_loss_weight: 25.0
    variance_loss_weight: 15.0
    covariance_loss_weight: 1.0

    # --- SIGReg (LeJEPA, arXiv 2511.08544). Used when type: "sigreg".
    # Single hyperparameter `lambda`; kept selectable so VICReg and SIGReg can
    # be ablated head to head.
    sigreg:
      lambda: 1.0
      apply_to: "context"      # context | predictions | both
      num_projections: 16
      num_quadrature: 33
      t_max: 5.0
      max_tokens: 8192

    # Also regularize the encoder output, which is what the decoder and any
    # linear probe consume.
    regularize_context: true
  
  # Optimization
  optimizer:
    name: "adamw"
    learning_rate: 7.5e-4
    weight_decay: 0.02
    betas: [0.9, 0.95]
    eps: 1.0e-8
    encoder_lr_multiplier: 1.00
  
  # Learning rate schedule
  lr_scheduler:
    type: "cosine"  # cosine | linear | constant
    warmup_epochs: 0.1
    min_lr: 1.0e-6
  
  # Training duration
  max_epochs: 40
  
  # EMA configuration
  ema:
    enabled: true
    momentum_base: 0.998
    momentum_final: 1.0
    schedule: "cosine"
  
  # Regularization
  dropout: 0.05
  gradient_clip_val: 1.0
  
  # Logging
  log_every_n_steps: 50
  log_histograms: false  # Log weight histograms (expensive)

data:
  data_dir: "data/processed/"
  checkpoint_dir: "checkpoints/"
  output_dir: "lightning/"
  datasets: ["electricity-hourly", "traffic-hourly", "rain-temperature", "weather", "weather", "australian-weather", "m4-hourly", "australian-electricity-demand", "electricity-demand", "bitcoin", "kdd-cup-2018", "saugeenday", "solar-power-4-seconds", "sunspot-daily", "solar-10-minute-dataset", "us-births", "windpower-4-seconds", "nn5-daily", "melbourne-pedestrian-count", "wikipedia-web-traffic-weekly", "london-smart-meters", "fred-md", "wind-farms-minutely", "rideshare"]
  datasets_finetune: ["electricity-hourly", "traffic-hourly", "weather", "australian-weather", "m4-hourly", "australian-electricity-demand", "electricity-demand", "melbourne-pedestrian-count"]
  datasets_eval: ["electricity-hourly", "traffic-hourly", "m4-hourly", "london-smart-meters", "wikipedia-web-traffic-extended", "melbourne-pedestrian-count", "bitcoin", "nn5-daily", "solar-10-minute-dataset", "saugeenday"]
  combine_mode: "concatenate"
  batch_size: 512
  stride: 8
  normalize_mode: "global"
  normalizer_type: "identity"
  clip_outliers: false
  clip_sigma: 5.0
  balanced_sampling: true
  sampling_temperature: 0.5
  max_oversample_ratio: 6.0
  train_val_test_split: [0.96, 0.02, 0.02]
  seed: 420

  # Multi-resolution sampling (train split only): reads a longer raw stretch
  # and decimates it, so the seasonal period in patch positions varies during
  # pretraining. Distinct from augmentations.drs, which downsamples then
  # interpolates back to the same length and leaves the period/patch ratio intact.
  multi_resolution_factors: [1, 2, 3, 4]
  p_multi_resolution: 0.35

  # Dataloader workers. Datasets are held in memory as numpy object arrays,
  # whose refcount updates defeat fork's copy-on-write, so worker count
  # multiplies RSS. 8 train + 8 persistent validation workers were OOM-killed.
  num_workers: 4
  persistent_workers: false

nixtla:
  - ettm1
  - ettm2
  - etth1
  - etth2
  - electricity
  - ecl
  - exchange
  - traffic
  - ili
  - weather

horizons: [96, 192, 336, 720]

augmentations:
  # Pretraining augmentations
  pretrain:
    enabled: true
    
    # Random scaling for MAPE
    scale_enabled: true
    scale_range: [0.8, 1.4]
    scale_log_uniform: true
    p_scale: 0.5
    
    # Gaussian jitter (context only)
    jitter_enabled: true
    jitter_std: 0.015
    jitter_relative: true
    p_jitter: 0.15
    
    # Magnitude warping
    magnitude_warp_enabled: true
    magnitude_warp_sigma: 0.2
    magnitude_warp_knots: 4
    p_magnitude_warp: 0.3
    
    # TTM-style DRS
    drs_enabled: true
    drs_factors: [2, 3, 4]
    drs_interpolation: "linear"
    p_drs: 0.15
    
    # Optional extras
    trend_enabled: false
  
  finetune:
    enabled: true
    scale_enabled: true
    scale_range: [0.9, 1.15]
    p_scale: 0.3
    jitter_enabled: true
    jitter_std: 0.01
    p_jitter: 0.1
    magnitude_warp_enabled: false
    drs_enabled: false
    trend_enabled: false

checkpoint:
  monitor: "val_loss"
  mode: "min"
  save_top_k: 3
  save_last: true
  # No '=' in the name: Hydra's override grammar treats '=' as a separator, so
  # a checkpoint path containing one cannot be passed on the command line
  # without quoting.
  filename: "epoch{epoch:02d}_valloss{val_loss:.4f}"
  auto_insert_metric_name: false

early_stopping:
  enabled: true
  monitor: "val_loss"
  patience: 25
  mode: "min"
  min_delta: 0.0001

trainer:
  accelerator: "auto"  # auto | cpu | gpu | tpu
  devices: -1  # Number of devices to use
  precision: "bf16-mixed"  # 32-true | 16-mixed | bf16-mixed
  max_epochs: ${training.max_epochs}  # Reference from training section
  gradient_clip_val: ${training.gradient_clip_val}  # Reference from training
  accumulate_grad_batches: 3  # Gradient accumulation steps
  val_check_interval: 0.1  # Validate every epoch (1.0) or every N steps (int)

  # The validation split is 2% of the windows (2109 batches on the full corpus);
  # at val_check_interval=0.1 that would cost more compute than training.
  # 300 batches (~150k samples) give a stable val_loss.
  limit_val_batches: 300
  limit_train_batches: null
  log_every_n_steps: ${training.log_every_n_steps}  # Reference from training
  deterministic: false
  strategy: "ddp_find_unused_parameters_true" 
  enable_progress_bar: true
  enable_model_summary: true
  use_distributed_sampler: false # the project's own sampler shards the data

wandb:
  project: "TimeJEPA"
  entity: "iuseamouse"
  run_name: null  # Auto-generated
  tags:
    - "tiny"
    - "jepa_tst"
    - "v1"
    - "pytorch-lightning"
  log_model: true  # Log checkpoints
  log_gradients: false  # Log gradients (expensive)
  log_freq: 100  # Gradient logging frequency