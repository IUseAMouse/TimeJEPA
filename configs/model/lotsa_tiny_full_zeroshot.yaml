# @package _global_
#
# G7 - zero-shot FINETUNE of the tiny pretrained on the FULL corpus.
#
#   python scripts/train.py --config-name lotsa_tiny_full_zeroshot \
#       +training.pretrained_encoder_path=checkpoints/timejepa_lotsa_tiny_full/pretrain_True/<ckpt> \
#       wandb.run_name=tiny-full-zeroshot
#
#   # Nixtla/Monash eval (geometry is that of lotsa_tiny_eval):
#   python scripts/evaluate.py --config-name lotsa_tiny_eval \
#       +checkpoint_path=checkpoints/timejepa_lotsa_tiny_full_zs/pretrain_False/<ckpt>
#   # GIFT eval:
#   python scripts/evaluate_gift.py --config-name lotsa_tiny_eval \
#       +checkpoint_path=checkpoints/timejepa_lotsa_tiny_full_zs/pretrain_False/<ckpt>
#
# Same protocol as lotsa_tiny_zeroshot - full_finetune, decoder trained on the
# pretrain corpus, zero data from the eval domain - but on lotsa_full,
# inherited from lotsa_tiny_full: the finetune must see THE SAME corpus as
# the pretrain, otherwise the tiny-capped vs tiny-full comparison mixes two
# variables. Distinct name for the same reason as lotsa_tiny_recon_zeroshot:
# train.py derives the checkpoint directory from model.name, and mixing the
# outputs of two arms is the most expensive failure mode there is.
defaults:
  - lotsa_tiny_full
  - _self_

model:
  name: "timejepa_lotsa_tiny_full_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"

data:
  datasets_finetune: null

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "zeroshot"
    - "full-corpus"
