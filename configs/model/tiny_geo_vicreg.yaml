# @package _global_
#
# VICReg arm of the geometry round. Identical to tiny_geo except the pretrain loss.
#
#   python scripts/train.py    --config-name tiny_geo_vicreg wandb.run_name=geo-vicreg
#   python scripts/train.py    --config-name tiny_geo_vicreg training.mode=finetune \
#       +training.pretrained_encoder_path=checkpoints/timejepa_tiny_geo_vicreg/pretrain_True/<ckpt>
#   python scripts/evaluate.py --config-name tiny_geo_vicreg \
#       +checkpoint_path=checkpoints/timejepa_tiny_geo_vicreg/pretrain_False/<ckpt>
#
# First run of the corrected VICReg: older "VICReg" checkpoints ran with the
# pooled version (variance computed after reshape(-1, D), blind to
# positional collapse) and variance/covariance weights at 0.0, that is, pure
# MSE. This arm tests per-position VICReg, 25/15/1, regularizing the encoder
# embeddings.
#
# `train_vicreg/variance` near zero means no collapse pressure; a hinge
# working hard means information SIGReg was not giving. Cross-check with
# `collapse/effective_rank` (3.7-4.8 at init on real signal; the alarm is
# approaching 1.0) and `collapse/context_std`.
#
# The arms' val_loss are not comparable to each other (different
# objectives). Arbitration happens on the downstream eval, same commands.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_tiny_geo_vicreg"

training:
  loss:
    type: "vicreg"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "ctx1024"
    - "vicreg"
