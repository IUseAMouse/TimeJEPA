# @package _global_
#
# G4.5 - NO-PRETRAINING BASELINE. The control for TimeJEPA's central bet.
#
#   python scripts/train.py --config-name tiny_geo_scratch wandb.run_name=geo-scratch
#   # 32/16 arm: --config-name tiny_geo_scratch model.patch_length=32 model.stride=16 \
#   #             model.name=timejepa_tiny_geo_p32_scratch
#
#   python scripts/evaluate.py --config-name tiny_geo_scratch \
#       +checkpoint_path=checkpoints/timejepa_tiny_geo_scratch/pretrain_False/<ckpt>
#
# WARNING: NO +training.pretrained_encoder_path - that is the WHOLE point of
# this config. Without the flag, the finetune starts from random init: same
# architecture, same budget, same data, trained supervised end to end.
#
# Why this run exists
# ----------------------
# Everything shown so far: the JEPA recipe *works*. Never shown: that it
# *beats the alternative*. If the pretrain->finetune pipeline does not beat
# this baseline, the central bet is refuted regardless of the rest; if it
# does, it is the proof the paper is missing. To do BEFORE LOTSA: scaling the
# data only makes sense if the pretrain objective it feeds has proven its
# value.
#
# Reading rules (follow them, or the result proves nothing)
# -------------------------------------------------------------------
# - full_finetune is MANDATORY: gradual_unfreeze would freeze random weights
#   during the first epoch. Set below, do not override.
# - Be GENEROUS with the baseline: same epochs, same early stopping
#   (patience 25). If it stops short, give it more epochs before concluding.
#   A win against an undertrained baseline proves nothing.
# - Judge on the benchmark eval (skill / WQL / coverage), not on val_loss.
# - The finetune LR is calibrated for a pretrained encoder; if the scratch arm
#   visibly plateaus, try training.optimizer.learning_rate=3e-4 and keep the
#   BEST of the two - always in the baseline's favor.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_tiny_geo_scratch"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "baseline"
    - "no-pretrain"
