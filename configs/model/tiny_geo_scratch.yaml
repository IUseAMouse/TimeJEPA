# @package _global_
#
# No-pretraining baseline. The control for TimeJEPA's central bet.
#
#   python scripts/train.py --config-name tiny_geo_scratch wandb.run_name=geo-scratch
#   # 32/16 arm: --config-name tiny_geo_scratch model.patch_length=32 model.stride=16 \
#   #             model.name=timejepa_tiny_geo_p32_scratch
#
#   python scripts/evaluate.py --config-name tiny_geo_scratch \
#       +checkpoint_path=checkpoints/timejepa_tiny_geo_scratch/pretrain_False/<ckpt>
#
# No +training.pretrained_encoder_path, by design: the finetune starts from
# random init, same architecture, same budget, same data, trained supervised
# end to end.
#
# Reading rules:
# - full_finetune is required: gradual_unfreeze would freeze random weights
#   during the first epoch. Set below, do not override.
# - Give the baseline the same epochs and early stopping (patience 25). If it
#   stops short, give it more epochs before concluding.
# - Judge on the benchmark eval (skill / WQL / coverage), not on val_loss.
# - The finetune LR is calibrated for a pretrained encoder; if the scratch
#   arm plateaus, try training.optimizer.learning_rate=3e-4 and keep the
#   best of the two.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_tiny_geo_scratch"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "baseline"
    - "no-pretrain"
