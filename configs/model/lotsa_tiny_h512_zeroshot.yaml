# @package _global_
#
# Native horizon 512 by extending the lotsa_tiny checkpoint.
#
#   # zero-shot finetune from the existing lotsa_tiny pretrain (no new pretrain)
#   python scripts/train.py --config-name lotsa_tiny_h512_zeroshot \
#       +training.pretrained_encoder_path=checkpoints/timejepa_lotsa_tiny/pretrain_True/<ckpt> \
#       wandb.run_name=h512-zeroshot
#
#   # GIFT eval (compare the medium/long terms to the rollout baseline)
#   python scripts/evaluate_gift.py --config-name lotsa_tiny_h512_eval \
#       +checkpoint_path=checkpoints/timejepa_lotsa_tiny_h512_zs/pretrain_False/<ckpt>
#
# 42 of the 97 GIFT configs are medium/long, and that is where the model
# degrades (per-term ratios: 0.914 short / 1.056 medium / 1.084 long). The
# suspected mechanism is the autoregressive rollout: h=720 = 3 rollouts of
# 256, each feeding a trajectory back. Native horizon 512 => h=720 in 2
# rollouts, h=480 in 1. A from-scratch 512 pretrain would change two extra
# variables (the dataset window 1280 -> 1536 and the budget); extending the
# existing checkpoint changes only the finetune's native horizon.
#
# Mechanics: the only model parameter whose shape depends on the horizon is
# the predictor's query table ([1, 50, d] -> [1, 98, d]). Without the flag
# below it would be refused at load time; `extend_horizon_queries: true`
# copies the 50 pretrained rows and initializes the 48 new ones
# (grow_future_query_table). The extended horizon_lengths + p_random_horizon
# give them gradient. The quantile decoder is horizon-independent.
#
# Finetune window = 1024 + 512 = 1536: on the first run, read the
# "N/M dataset(s) skipped" setup line. LOTSA datasets with chunks < 1536
# leave the finetune, which is part of the arm's cost.
defaults:
  - lotsa_tiny_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_tiny_h512_zs"
  prediction_length: 512

training:
  extend_horizon_queries: true
  horizon_lengths: [64, 96, 128, 192, 256, 384, 512]
  p_random_horizon: 0.5

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "zeroshot"
    - "h512"
