# @package _global_
# Zero-shot finetune of the xres arm. Inherits mixed corpus + arcsinh + FiLM.
#   python scripts/train.py --config-name lotsa_tiny_xres_zeroshot \
#       +training.pretrained_encoder_path=checkpoints/timejepa_lotsa_tiny_xres/pretrain_True/last.ckpt
# forward_finetune applies the FiLM at w=1: after pretrain its bias is
# trained and skipping it is no longer the identity.
defaults:
  - lotsa_tiny_xres
  - _self_

model:
  name: "timejepa_lotsa_tiny_xres_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  # LR cap 3e-4 (inherited: 7.5e-4). On the tiny-full finetune, all the
  # descent happened once the cosine dropped below ~3e-4; starting there puts
  # the whole run in the productive regime. Shared by mix and xres.
  optimizer:
    learning_rate: 3.0e-4
  # 3 epochs: on tiny-full the finetune curves were still going down at the
  # end of epoch 1. The cosine spans max_epochs, so a manual stop before the
  # end leaves the LR mid-descent. Shared by mix and xres.
  max_epochs: 3

data:
  datasets_finetune: null

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "cross-resolution", "robust-scale"]
