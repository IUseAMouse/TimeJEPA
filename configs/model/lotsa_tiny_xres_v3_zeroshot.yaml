# @package _global_
# xres-v3 zero-shot finetune - THE core of G9.3: the (k1,k2) pairs stay
# ACTIVE at finetune (w!=1 traverses the FiLM and the quantile head - the
# pinball supervises a fan at rate k2 against a target at rate k2) and the
# invariance anchor lambda*MSE(z_hat, z_tgt) preserves the judge and rate
# coherence (E18b).
#
#   python scripts/train.py --config-name lotsa_tiny_xres_v3_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_tiny_xres_v3/pretrain_True/<latest named ckpt>"'
#
# Witnesses to check in the first decile: aug/w_neq1_frac > 0 (otherwise the
# arm is STERILE - failure mode B5), train_loss/anchor logged and stable.
# Predictions at launch: P-x.1 cross-freq (10T/15T + decimated) down vs the
# v3 twin; P-x.2 probe-judge of the FINETUNED checkpoint <= 0.30 (vs 0.409
# measured in E18b - the anchor preserves the judge); P-x.3 the w:=1 surgery
# at eval degrades the multi-frequency configs (otherwise the FiLM is
# decorative).
defaults:
  - lotsa_tiny_xres_v3
  - _self_

model:
  name: "timejepa_lotsa_tiny_xres_v3_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  max_epochs: 1
  loss:
    # lambda below the lambda_z=0.1 that did not siphon (E21, inverted
    # witness); same monitoring pattern: if train_loss deviates > 2% from the
    # v3 twin at equal step, fall back to 0.05.
    lambda_anchor: 0.1

checkpoint:
  save_top_k: -1

data:
  datasets_finetune: null
  multi_resolution_factors_finetune: [1, 2, 4]
  p_multi_resolution_finetune: 0.3

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "xres", "robust-scale"]
