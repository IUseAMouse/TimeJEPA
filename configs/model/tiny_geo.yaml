# @package _global_
#
# Geometry round: context extended to 1024, native horizon extended to 256,
# back to patch 16/8, and context randomization also at finetune.
#
# This config carries the round's defaults: sigreg loss, quantile decoder,
# finetune on all 24 datasets. No override needed; long commands had become
# the first source of errors (silent mlp decoder, p32 geometry forgotten at
# eval, '=' in paths).
#
#   # pretrain
#   python scripts/train.py --config-name tiny_geo wandb.run_name=geo-pretrain
#
#   # finetune (quantile by default, from the checkpoint above)
#   python scripts/train.py --config-name tiny_geo training.mode=finetune \
#       +training.pretrained_encoder_path=checkpoints/timejepa_tiny_geo/pretrain_True/<ckpt> \
#       wandb.run_name=geo-quantile
#
#   # eval
#   python scripts/evaluate.py --config-name tiny_geo \
#       +checkpoint_path=checkpoints/timejepa_tiny_geo/pretrain_False/<ckpt>
#
# The other arms each have their own config, never run via overrides:
# tiny_geo_p32 (patch 32/16), tiny_geo_vicreg (VICReg loss),
# tiny_geo_scratch (no pretrain).
#
# The four changes:
# 1. context_lengths -> 1024. The post-hoc sweep showed ETTm gaining +5 to +8
#    skill points at ctx 1024 despite an encoder never trained beyond 512,
#    with the optimum (640) at the training frontier. Not 2048: attention
#    cost 16.8x vs 4.1x.
# 2. prediction_length 128 -> 256. h=720 goes from 6 rolls to 3, h=336 from
#    3 to 2, h=192 becomes single-pass. Each roll feeds back the median
#    trajectory, smoother than reality, which shrinks intervals at long
#    horizons; fewer rolls compound that bias less.
# 3. Back to patch 16/8 (tiny.yaml default). The patch32 motivation
#    (positions/cycle) was overturned by the sweep: the driver is the number
#    of cycles in the window, independent of patch. patch32 arm:
#    --config-name tiny_geo_p32, never via override (at eval, a wrong
#    geometry only warns "re-initialising patching.*" and outputs wrong numbers).
# 4. p_random_context_finetune. The encoder was trained on 128-512 but the
#    decoder only saw 512, so at any other eval length the decoder was out of
#    distribution. The horizon stays fixed at finetune (eval already
#    truncates, rollout uses the full native horizon per roll).
#
# Costs:
# - Required window 1024+256 = 1280 steps -> excluded: wikipedia-weekly,
#   rideshare, rain-temperature (725), nn5-daily (791), m4-hourly (1008),
#   ~7% of the batch. Multi-resolution eligibility shrinks too (factor 4 =>
#   5120 steps required); read the "Multi-resolution" log line.
# - Attention O(N^2): 127 patches at ctx 1024 vs 63 at 512. batch_size
#   512->256 and accumulation 3->6 keep the effective batch at 1536 while
#   halving peak memory. `+trainer.max_steps=30000` bounds a comparison run.
# - After this pretrain, re-sweep context at eval: the optimum measured at
#   640 was that of a model trained up to 512.
defaults:
  - tiny
  - _self_

model:
  name: "timejepa_tiny_geo"
  seq_length: 1024
  prediction_length: 256

  decoder:
    # Quantile by default (tiny.yaml says "mlp"): the round is compared in
    # quantile, and a point decoder started by accident produces "WQL"
    # columns that are actually point ND. A point decoder is the explicit
    # override (model.decoder.type=mlp).
    type: "quantile"

training:
  # The cosine scheduler is stretched over `max_epochs`. The tiny.yaml
  # default is 40, but geo pretrains stopped at 5 via early stopping, so the
  # LR barely decayed and those runs ran at maximal LR end to end. 8 matches
  # the budget actually consumed, with margin. Earlier geo results were
  # obtained without this annealing; paired comparisons among them hold.
  max_epochs: 8

  # The tiny.yaml default is "vicreg". The VICReg arm has its own config
  # (tiny_geo_vicreg).
  loss:
    type: "sigreg"

  # finetune_mode stays "gradual_unfreeze" (tiny.yaml default). Before the
  # unfreeze fix this mode only trained the decoder, so older results are
  # frozen-encoder probes; geo arms are comparable among themselves.
  context_lengths: [128, 192, 256, 384, 512, 640, 768, 1024]
  p_random_context: 0.5
  horizon_lengths: [64, 96, 128, 192, 256]
  p_random_horizon: 0.5
  p_random_context_finetune: 0.5

data:
  batch_size: 256

  # Finetune on all datasets: the curated-8 list inherited from tiny.yaml
  # cost +12 skill points on average and +65 on exchange (the decoder had
  # never seen a random walk). Interpolated from data.datasets so it cannot
  # drift; too-short datasets are skipped.
  datasets_finetune: ${data.datasets}

trainer:
  accumulate_grad_batches: 6

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "ctx1024"
