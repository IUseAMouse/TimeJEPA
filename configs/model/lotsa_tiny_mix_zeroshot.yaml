# @package _global_
# Zero-shot finetune of the mixed control. Distinct name (the recon lesson).
#   python scripts/train.py --config-name lotsa_tiny_mix_zeroshot \
#       +training.pretrained_encoder_path=checkpoints/timejepa_lotsa_tiny_mix/pretrain_True/last.ckpt
defaults:
  - lotsa_tiny_mix
  - _self_

model:
  name: "timejepa_lotsa_tiny_mix_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  # LR cap 3e-4 (decision 2026-08-21, inherited: 7.5e-4). Measured on the
  # tiny-full finetune: ~zero net progress from 100k to 400k steps
  # (oscillation band, one instability spike at ~240k), ALL the descent once
  # the cosine dropped below ~3e-4. Starting at 3e-4 puts the whole 3 epochs
  # in the productive regime. Shared mix/xres (one-variable duel preserved).
  optimizer:
    learning_rate: 3.0e-4
  # 3 epochs (decision 2026-08-21, after 2 on 2026-08-20): on tiny-full,
  # the finetune curves were still going down clearly at the end of epoch 1 -
  # budget was the limiting factor, not the model. The cosine spans
  # max_epochs, so 3 is a scheduler choice, not a mere extension; a manual
  # stop before the end leaves the LR mid-descent.
  # WARNING - comparability: mix and xres share this budget (their duel - THE
  # one-variable comparison - stays clean); mix-vs-tiny-full adds the finetune
  # budget to the already accepted bundle (corpus+arcsinh), to state in E18+.
  max_epochs: 3

data:
  datasets_finetune: null

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "mix-control", "robust-scale"]
