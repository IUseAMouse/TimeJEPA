# @package _global_
# Finetune zero-shot du contrôle mixte. Nom distinct (la leçon recon).
#   python scripts/train.py --config-name lotsa_tiny_mix_zeroshot \
#       +training.pretrained_encoder_path=checkpoints/timejepa_lotsa_tiny_mix/pretrain_True/last.ckpt
defaults:
  - lotsa_tiny_mix
  - _self_

model:
  name: "timejepa_lotsa_tiny_mix_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  # Plafond LR 3e-4 (décision utilisateur 2026-08-21, hérité : 7.5e-4). Mesuré
  # sur le finetune tiny-full : progrès net ~nul de 100k à 400k steps (bande
  # d'oscillation, un pic d'instabilité à ~240k), TOUTE la descente une fois le
  # cosinus passé sous ~3e-4. Démarrer à 3e-4 met les 3 époques entières dans
  # le régime productif. Partagé mix/xres (duel à une variable préservé).
  optimizer:
    learning_rate: 3.0e-4
  # 3 époques (décision utilisateur 2026-08-21, après 2 le 2026-08-20) : sur
  # tiny-full, les courbes de finetune descendaient encore nettement en fin
  # d'époque 1 — le budget était le facteur limitant, pas le modèle. Le cosinus
  # s'étale sur max_epochs, donc 3 est un choix de scheduler, pas un simple
  # prolongement ; un arrêt manuel avant terme laisse le LR à mi-descente.
  # ⚠️ Comparabilité : mix et xres partagent ce budget (leur duel — LA
  # comparaison à une variable — reste propre) ; mix-vs-tiny-full ajoute le
  # budget de finetune au bundle déjà assumé (corpus+arcsinh), à dire dans E18+.
  max_epochs: 3

data:
  datasets_finetune: null

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "mix-control", "robust-scale"]
