# @package _global_
# Augmentation arm: finetune with decimated inputs, no FiLM.
#
# Motive: the RateIN inference layer decimates 35% of eval instances
# (mean-pooling in blocks of k), yet v3 never saw a decimated series in
# training. This arm aligns training on that regime: k1=k2 drawn from the
# same factors as the xres config, so (aug alone) vs (full xres) differs only
# by the FiLM/w/anchor bundle. cross_resolution stays false, so w=1
# everywhere and no new parameter; eval via lotsa_tiny_v3_aug_eval.
#
#   python scripts/train.py --config-name lotsa_tiny_v3_aug_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_tiny_v3/pretrain_True/<ckpt>"'
defaults:
  - lotsa_tiny_v3_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_tiny_v3_aug_zs"

data:
  multi_resolution_factors_finetune: [1, 2, 4]
  p_multi_resolution_finetune: 0.3

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "aug-decim", "robust-scale"]
