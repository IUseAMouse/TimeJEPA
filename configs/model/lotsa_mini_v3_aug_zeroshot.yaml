# @package _global_
# Augmentation arm on mini: same bundle as lotsa_tiny_v3_aug_zeroshot (see its
# header for the motive), applied to the mini pretrain. Paired control with
# the standard mini finetune: same pretrain checkpoint, single variable = the
# two data keys below. Eval via lotsa_mini_v3_aug_eval (own output namespace);
# architecture unchanged (cross_resolution false, w=1, no new parameters).
#
#   python scripts/train.py --config-name lotsa_mini_v3_aug_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_mini_v3/pretrain_True/<ckpt>"'
defaults:
  - lotsa_mini_v3_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_mini_v3_aug_zs"

data:
  multi_resolution_factors_finetune: [1, 2, 4]
  p_multi_resolution_finetune: 0.3

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "aug-decim", "robust-scale"]
