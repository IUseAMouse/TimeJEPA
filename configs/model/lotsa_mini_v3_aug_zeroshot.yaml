# @package _global_
# G9.0-AUGMENTATION arm on MINI - same bundle as lotsa_tiny_v3_aug_zeroshot
# (see its header for the measured motive and predictions P-aug.1..3),
# applied to the mini pretrain. Launch AFTER the standard mini finetune
# (paired control: same pretrain checkpoint, single variable = the two data
# keys below). Eval via lotsa_mini_v3_eval, architecture unchanged
# (cross_resolution false, w=1, zero new parameters).
#
#   python scripts/train.py --config-name lotsa_mini_v3_aug_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_mini_v3/pretrain_True/<ckpt>"'
defaults:
  - lotsa_mini_v3_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_mini_v3_aug_zs"

data:
  multi_resolution_factors_finetune: [1, 2, 4]
  p_multi_resolution_finetune: 0.3

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "aug-decim", "robust-scale"]
