# @package _global_
# Arm G9.0-AUGMENTATION sur MINI — même bundle que lotsa_tiny_v3_aug_zeroshot
# (voir son en-tête pour le motif mesuré et les prédictions P-aug.1..3),
# appliqué au pretrain mini. À lancer APRÈS le finetune mini standard
# (contrôle apparié : même checkpoint pretrain, une seule variable = les
# deux clés data ci-dessous). Éval via lotsa_mini_v3_eval, architecture
# inchangée (cross_resolution false, w=1, zéro paramètre nouveau).
#
#   python scripts/train.py --config-name lotsa_mini_v3_aug_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_mini_v3/pretrain_True/<ckpt>"'
defaults:
  - lotsa_mini_v3_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_mini_v3_aug_zs"

data:
  multi_resolution_factors_finetune: [1, 2, 4]
  p_multi_resolution_finetune: 0.3

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "aug-decim", "robust-scale"]
