# @package _global_
# Zero-shot finetune of the v3 corpus (1 cosine epoch, selection by GIFT
# eval, all checkpoints kept).
#
#   python scripts/train.py --config-name lotsa_tiny_v3_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_tiny_v3/pretrain_True/last.ckpt"'
#
# Finetune augmentations stay the inherited (light) ones: the TiRex-style
# ones are a pretrain lever. Rationing inherited from lotsa_tiny_v3 (same
# sampler on both sides of the v3 pretrain/finetune).
defaults:
  - lotsa_tiny_v3
  - _self_

model:
  name: "timejepa_lotsa_tiny_v3_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  max_epochs: 1

checkpoint:
  # Selection happens via GIFT eval, not val_loss: keep every checkpoint
  # (~20 x 16 MB), which also allows checkpoint averaging.
  save_top_k: -1

data:
  datasets_finetune: null

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "robust-scale"]
