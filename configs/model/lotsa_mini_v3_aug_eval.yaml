# @package _global_
# Eval for the augmentation-arm mini checkpoints. Architecture is identical to
# lotsa_mini_v3_eval; this config exists for the output namespace: aug and
# standard finetunes emit identically named checkpoints (epoch00_valloss*),
# and sharing the eval model.name collides in evaluation/.
defaults:
  - lotsa_mini_v3_eval
  - _self_

model:
  name: "timejepa_lotsa_mini_v3_aug_zs"

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "eval", "v3", "aug-decim", "robust-scale"]
