# @package _global_
# Zero-shot finetune of mini-mix - G7.3c protocol (E18i).
#
#   python scripts/train.py --config-name lotsa_mini_mix_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_mini_mix/pretrain_True/last.ckpt"'
#
# WARNING - max_epochs: 1 - E18i DOCTRINE, NOT the 3 of
# lotsa_tiny_mix_zeroshot: this lineage's finetune gains land during the
# ramp, then the hot LR makes the model wander in the plateau (measured
# random walk, flat val, degrading GIFT). The cosine stretched over 1 epoch
# crosses the gain zone at full throttle then anneals BEFORE the drift
# accumulates. Same protocol as the tiny run `mix_zs_1ep3e4` (2026-08-23) ->
# the finetune scale comparison stays one-variable. Evaluate checkpoints
# along the way on GIFT and copy any champion to checkpoints/champions/
# (lesson from the eviction).
defaults:
  - lotsa_mini_mix
  - _self_

model:
  name: "timejepa_lotsa_mini_mix_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  # Cap 3e-4: identical to the tiny finetune (lotsa_tiny_mix_zeroshot).
  optimizer:
    learning_rate: 3.0e-4
  max_epochs: 1

data:
  datasets_finetune: null

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "mix", "robust-scale"]
