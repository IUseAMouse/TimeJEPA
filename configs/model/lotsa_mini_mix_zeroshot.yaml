# @package _global_
# Zero-shot finetune of mini-mix.
#
#   python scripts/train.py --config-name lotsa_mini_mix_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_mini_mix/pretrain_True/last.ckpt"'
#
# max_epochs: 1 rather than the 3 of lotsa_tiny_mix_zeroshot: in this lineage
# the finetune gains land during the LR ramp, then the hot LR makes the model
# drift in the plateau (flat val, degrading GIFT). A cosine stretched over one
# epoch anneals before the drift accumulates. Same protocol as the tiny
# 1-epoch finetune, so the scale comparison stays one-variable.
defaults:
  - lotsa_mini_mix
  - _self_

model:
  name: "timejepa_lotsa_mini_mix_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  # Same LR cap as the tiny finetune (lotsa_tiny_mix_zeroshot).
  optimizer:
    learning_rate: 3.0e-4
  max_epochs: 1

data:
  datasets_finetune: null

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "mix", "robust-scale"]
