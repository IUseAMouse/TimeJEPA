# @package _global_
# Scratch control: the head8 finetune recipe with no pretrained weights, the
# direct measure of what the JEPA pretrain is worth on GIFT-Eval. Same corpus
# (lotsa_v3), same head x8, same optimizer, same single epoch; lambda_anchor
# is already 0 in this lineage.
#
#   python scripts/train.py --config-name lotsa_mini_v3_head8_scratch_zeroshot
#   # no +training.pretrained_encoder_path, by design.
#   # eval: lotsa_mini_v3_head8_scratch_eval, flip+backtest, matched vs head8.
defaults:
  - lotsa_mini_v3_head8_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_mini_v3_head8_scratch_zs"

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "head8", "scratch", "robust-scale"]
