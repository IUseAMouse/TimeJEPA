# @package _global_
#
# LOTSA pretrain, mini scale (5.1M parameters, below Chronos-Bolt-Tiny ~9M,
# Moirai-small ~14M, TiRex ~35M).
#
#   make train CONFIG=lotsa_mini ARGS="trainer.accumulate_grad_batches=2 wandb.run_name=lotsa-mini"
#
# Inherits from `lotsa_tiny` for everything that is not model size (corpus,
# memmap, exclusions, stride, 1024/256 geometry, sigreg loss, quantile
# decoder), so the only variable across scales is capacity.
#
# The dimensions are written explicitly rather than inherited from `mini.yaml`,
# whose `data` block would overwrite the LOTSA corpus; a test verifies they
# stay identical to the reference.
#
# Batch 384 x accumulation 1 x 3 GPUs = 1152 effective batch, a starting point
# for 24 GB at context 1024. +trainer.max_steps=5000 bounds a smoke test.
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_mini"
  encoder:
    d_model: 192
    n_heads: 6
    n_layers: 4
    d_ff: 768
  predictor:
    d_model: 192
    n_heads: 6
    n_layers: 3
    d_ff: 768
  decoder:
    d_model: 192
    hidden_dim: 384
    n_layers: 4

training:
  optimizer:
    learning_rate: 0.0004

data:
  batch_size: 384

trainer:
  accumulate_grad_batches: 1

wandb:
  tags:
    - "mini"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
