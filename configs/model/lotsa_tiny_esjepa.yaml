# @package _global_
#
# ESJEPA ARM - "ErrorSignal-JEPA": the second latent pathway (G8.6;
# designed 2026-08-23).
#
#   # CONTROL (already run): the mix pretrain itself -
#   #   checkpoints/timejepa_lotsa_tiny_mix/pretrain_True/
#   # The arm:
#   python scripts/train.py --config-name lotsa_tiny_esjepa wandb.run_name=esjepa
#   # then: lotsa_tiny_esjepa_zeroshot (1-epoch finetune) and lotsa_tiny_esjepa_eval
#
# Mechanism: the MSE predictor converges to E[z_tgt|z_ctx] - a conditional
# mean (measured: pred_var 0.6 vs target_var 0.95); the dispersion information
# lives in the residual, never observed. The arm adds a z head on the
# predictor trunk that predicts the STATISTICS of the target window's EWMA
# smoothing residual (log-RMS, log-MAD, skewness, lag-1 autocorr per patch -
# conditional heteroscedasticity, never the noise realization, unrecoverable
# by definition). At finetune, z modulates the SPREAD of the quantile fan via
# a zero-init gate on the _make_monotone widths - the median is untouchable by
# construction: MASE structurally invariant, any WQL delta attributable to the
# spread. Cost: <9k params (+0.8%).
#
# ONE VARIABLE: inherits from lotsa_tiny_mix (v2 corpus, arcsinh, LR 3e-4,
# standalone targets, 2-epoch budget) - the esjepa-vs-mix duel carries only
# the z objective.
#
# Deliberate deviations (stated, not hidden):
#   1. val_loss includes the z component (lambda_z * smooth_l1) => NOT
#      comparable raw to the mix control's - compare val_loss/{invariance,sigreg,z}.
#   2. lambda_z = 0.1 (training.loss.lambda_z): 4 dims vs 128 for invariance.
#      Siphoning witness: if train_loss/invariance deviates >2% from the
#      control at equal epoch -> lambda_z=0.03 or the "separate z predictor"
#      fallback (in the plan).
#
# WITNESSES (equivalents of xres's aug/w_neq1_frac - if they are bad, the run
# measures nothing):
#   * esjepa/z_corr (val, Spearman z_pred vs realized log-RMS): prediction P1
#     stated BEFORE the run: > 0.3; ~0 = kill switch, the arm dies at pretrain.
#   * esjepa/z_pred_std_ratio: collapse toward the marginal mean.
defaults:
  - lotsa_tiny_mix
  - _self_

model:
  name: "timejepa_lotsa_tiny_esjepa"
  error_signal: true

training:
  loss:
    lambda_z: 0.1

checkpoint:
  # Added AFTER the 2026-08-25 run launched (no effect on it - manual
  # snapshots of last.ckpt as a stopgap): val plateau => top-3 frozen mid-run,
  # the late checkpoints were missing from the probe-judge series.
  save_top_k: -1

data:
  #   3. ration_oversample at PRETRAIN (decision 2026-08-25, E20: the
  #      pretrain loss fluctuations follow the same G10.2 composition drift;
  #      v3 will have it too). The mix control did not have it =>
  #      attribution rule if the GIFT duel is won: live z witnesses
  #      (z_corr > 0.3, gate_absmean lifted off) = the arm; dead witnesses =
  #      the rationing, and the arm is neutral.
  ration_oversample: true

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "pretrain", "error-signal", "robust-scale"]
