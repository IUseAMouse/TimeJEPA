# @package _global_
#
# ESJEPA arm ("ErrorSignal-JEPA"): a second latent pathway.
#
#   # control: the mix pretrain, checkpoints/timejepa_lotsa_tiny_mix/pretrain_True/
#   python scripts/train.py --config-name lotsa_tiny_esjepa wandb.run_name=esjepa
#   # then: lotsa_tiny_esjepa_zeroshot (1-epoch finetune) and lotsa_tiny_esjepa_eval
#
# Mechanism: the MSE predictor converges to the conditional mean E[z_tgt|z_ctx]
# (pred_var 0.6 vs target_var 0.95); the dispersion information lives in the
# residual. The arm adds a z head on the predictor trunk that predicts the
# statistics of the target window's EWMA smoothing residual (log-RMS,
# log-MAD, skewness, lag-1 autocorr per patch), never the noise realization.
# At finetune, z modulates the spread of the quantile fan via a zero-init gate
# on the _make_monotone widths; the median is untouched by construction, so
# MASE is invariant and any WQL delta comes from the spread. Cost: <9k params.
#
# One variable: inherits from lotsa_tiny_mix (v2 corpus, arcsinh, LR 3e-4,
# standalone targets, 2-epoch budget) and adds only the z objective.
#
# Deviations:
#   1. val_loss includes the z component (lambda_z * smooth_l1), so it is not
#      comparable raw to the mix control's; compare val_loss/{invariance,sigreg,z}.
#   2. lambda_z = 0.1 (training.loss.lambda_z): 4 dims vs 128 for invariance.
#      If train_loss/invariance deviates >2% from the control at equal epoch,
#      lower it to 0.03 or use a separate z predictor.
#
# Witnesses: esjepa/z_corr (val, Spearman z_pred vs realized log-RMS) should
# exceed 0.3, ~0 means the arm learns nothing at pretrain;
# esjepa/z_pred_std_ratio shows collapse toward the marginal mean.
defaults:
  - lotsa_tiny_mix
  - _self_

model:
  name: "timejepa_lotsa_tiny_esjepa"
  error_signal: true

training:
  loss:
    lambda_z: 0.1

checkpoint:
  # Keep every checkpoint: a val plateau freezes the top-3 mid-run and the
  # late checkpoints would be missing.
  save_top_k: -1

data:
  # Rationing at pretrain: the pretrain loss fluctuations follow the batch
  # composition drift. The mix control did not have it, so a GIFT gain is
  # attributed to the arm only if the z witnesses are alive (z_corr > 0.3,
  # gate_absmean lifted off).
  ration_oversample: true

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "pretrain", "error-signal", "robust-scale"]
