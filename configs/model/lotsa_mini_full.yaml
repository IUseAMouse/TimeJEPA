# @package _global_
#
# Pretrain of the mini (~5M) on the full LOTSA corpus.
#
#   python scripts/train.py --config-name lotsa_mini_full wandb.run_name=mini-full
#
# Inherits from lotsa_mini (192/4+3 architecture, LR 4e-4, batch 384) and only
# changes what lotsa_tiny_full changes for the tiny: the corpus and the epoch
# budget. The tiny-full / mini-full comparison is the scaling curve, so only
# the model size may move.
defaults:
  - lotsa_mini
  - _self_

model:
  name: "timejepa_lotsa_mini_full"

data:
  data_dir: "data/processed/lotsa_full"

training:
  # Same single-pass regime as lotsa_tiny_full: beyond one epoch the model
  # overfits, and `max_epochs` drives the cosine annealing.
  max_epochs: 1

trainer:
  val_check_interval: 0.05

early_stopping:
  # Disabled on single-pass runs: the cosine is stretched over `max_epochs: 1`,
  # so the model's value is at the end of the pass, when annealing completes.
  # Stopping early on a val_loss dip ships a model that was never annealed.
  enabled: false

wandb:
  tags:
    - "mini"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
    - "full-corpus"
