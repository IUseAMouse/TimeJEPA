# @package _global_
#
# G7 — PRETRAIN du MINI (~5M) sur le corpus LOTSA COMPLET.
#
#   python scripts/train.py --config-name lotsa_mini_full wandb.run_name=mini-full
#
# Hérite de lotsa_mini (architecture 192/4+3, LR 4e-4, batch 384) et ne change
# que ce que lotsa_tiny_full change pour le tiny : le corpus et le budget
# d'époques. Toute divergence supplémentaire entre les régimes tiny-full et
# mini-full rendrait leur comparaison ininterprétable — c'est la courbe
# d'échelle du papier, elle ne vaut que si SEULE la taille du modèle bouge.
#
# max_epochs: 2 — même logique qu'E13a/lotsa_tiny_full : le cosinus est étalé
# sur max_epochs, et sur le corpus complet une époque est déjà énorme. Voir
# l'en-tête de lotsa_tiny_full pour l'audit d'équilibre À FAIRE avant tout run.
defaults:
  - lotsa_mini
  - _self_

model:
  name: "timejepa_lotsa_mini_full"

data:
  data_dir: "data/processed/lotsa_full"

training:
  # Même régime à passe unique que lotsa_tiny_full — voir son en-tête pour le
  # raisonnement (E13b : au-delà d'une époque, sur-apprentissage mesuré ; et
  # `max_epochs` pilote le recuit cosinus).
  max_epochs: 1

trainer:
  val_check_interval: 0.05

early_stopping:
  # DÉSACTIVÉ sur les runs à passe unique, et c'est délibéré.
  #
  # Le cosinus est étalé sur `max_epochs: 1` : la valeur du modèle est à la FIN
  # de la passe, quand le recuit s'achève. Couper avant, c'est livrer un modèle
  # jamais recuit — le défaut exact qu'E13a a mesuré.
  #
  # Avec val_check_interval=0.05 il n'y a que ~20 validations, donc patience=25
  # ne se déclencherait de toute façon jamais : mieux vaut l'écrire que de
  # dépendre de cette coïncidence. Quiconque affinerait la validation (0.01 →
  # 100 points) rallumerait sinon un arrêt sur un creux de bruit, ce qu'E12 a
  # déjà payé une fois — la val_loss y désignait le modèle qui généralise LE
  # MOINS bien.
  enabled: false

wandb:
  tags:
    - "mini"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
    - "full-corpus"
