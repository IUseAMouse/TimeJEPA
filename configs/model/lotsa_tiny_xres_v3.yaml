# @package _global_
#
# Cross-resolution (xres) pretrain on the v3 recipe. Launched only if the
# per-config tail is still cross-frequency and RateIN at eval shows a gain
# (oracle-k > +5% somewhere) but hits a wall (missed detections or smoothing
# ceiling).
#
#   python scripts/train.py --config-name lotsa_tiny_xres_v3 wandb.run_name=xres-v3
#   # then: lotsa_tiny_xres_v3_zeroshot and lotsa_tiny_xres_v3_eval
#
# Amendments to the bare xres arm (lotsa_tiny_xres):
#   1. w=1 at GIFT eval left the capacity unused -> inference can pass w
#      (forecast(w=...)), and RateIN provides the causal k.
#   2. Zero slope gradient at finetune (log2(1)=0) -> the finetune exercises
#      w!=1 pairs (p_multi_resolution_finetune) + lambda*MSE anchor, since a
#      capacity survives only if traversed.
#   3. k1>1 material was rare and synthetic -> v3 corpus: ~54% of the batch
#      in 8192 chunks.
#
# Bundle (one-variable comparison against the lotsa_tiny_v3 control): xres
# objective + pairs at finetune + anchor.
defaults:
  - lotsa_tiny_v3
  - _self_

model:
  name: "timejepa_lotsa_tiny_xres_v3"
  cross_resolution: true

training:
  # Inherited from the mix/v3 lineage but restated: standalone targets are
  # required with xres (concatenating [ctx||target] on two grids is wrong;
  # hard guard in the module).
  contextualized_targets: false

data:
  multi_resolution_factors: [1, 2, 4]
  p_multi_resolution: 0.3

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "pretrain", "v3", "xres", "robust-scale"]
