# @package _global_
#
# Template for a single-variable experiment config. Copy it; do not run it as-is.
#
# Inherit from a base config and override only what you are testing, so the
# comparison against the base run changes one variable.
#
#   python scripts/train.py --config-name <this file's name without .yaml> \
#       wandb.run_name=my-experiment
#
# Before running, check the patch geometry is not degenerate: changing
# patch_length or stride changes the token counts, and some combinations give
# zero target patches (a crash) or too few to be meaningful:
#
#   def npatch(L, p, s):
#       if L < p: return 0
#       rem = (L - p) % s
#       if rem: L += (s - rem)
#       return (L - p) // s + 1
#
# Check it for every value in training.context_lengths and horizon_lengths, not
# only the nominal seq_length / prediction_length (see tiny_patch64.yaml).
defaults:
  - tiny
  - _self_

model:
  name: "timejepa_tiny_template"
  # patch_length: 32
  # stride: 16
  # predictor:
  #   n_layers: 4

# training:
#   context_lengths: [256, 320, 384, 448, 512]
#   horizon_lengths: [64, 96, 128]

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
