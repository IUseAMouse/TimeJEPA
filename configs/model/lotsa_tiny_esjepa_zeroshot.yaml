# @package _global_
# Zero-shot finetune of the ESJEPA arm - G7.3c protocol (1 epoch, cosine
# annealed within it), identical to the mix control's protocol so the duel
# stays one-variable.
#
#   python scripts/train.py --config-name lotsa_tiny_esjepa_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_tiny_esjepa/pretrain_True/last.ckpt"'
#
# The quantile decoder (inherited) receives z via the zero-init spread gate:
# the finetune starts EXACTLY from the baseline fan, modulation only appears
# if the gradient asks for it. Sterility witness: esjepa/gate_absmean ~0 at
# the end of finetune = the decoder ignores z - an interpretable negative
# result (context cross-attention suffices), not a silent failure.
# Predictions stated before the run: P2 = val_wql down vs control at equal
# val_mase (+/-0.5%, near guaranteed by the gate); P3 = wider fan on windows
# with large realized residual, bitbrains tail flares down.
defaults:
  - lotsa_tiny_esjepa
  - _self_

model:
  name: "timejepa_lotsa_tiny_esjepa_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  max_epochs: 1

checkpoint:
  # G7.3c doctrine: selection by intermediate GIFT eval, never by val_loss
  # (E20: even a clean, monotone val picks the wrong checkpoint) - keep
  # everything. Rationing is inherited from lotsa_tiny_esjepa (protocol
  # since E20).
  save_top_k: -1

data:
  datasets_finetune: null

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "error-signal", "robust-scale"]
