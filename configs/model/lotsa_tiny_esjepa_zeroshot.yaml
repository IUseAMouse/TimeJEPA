# @package _global_
# Zero-shot finetune of the ESJEPA arm (1 epoch, cosine annealed within it),
# identical to the mix control's protocol so the comparison stays one-variable.
#
#   python scripts/train.py --config-name lotsa_tiny_esjepa_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_tiny_esjepa/pretrain_True/last.ckpt"'
#
# The quantile decoder (inherited) receives z via the zero-init spread gate:
# the finetune starts from the baseline fan, and modulation only appears if
# the gradient asks for it. esjepa/gate_absmean ~0 at the end of finetune
# means the decoder ignores z (context cross-attention suffices).
defaults:
  - lotsa_tiny_esjepa
  - _self_

model:
  name: "timejepa_lotsa_tiny_esjepa_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  max_epochs: 1

checkpoint:
  # Selection by intermediate GIFT eval, never by val_loss, so keep every
  # checkpoint. Rationing is inherited from lotsa_tiny_esjepa.
  save_top_k: -1

data:
  datasets_finetune: null

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "error-signal", "robust-scale"]
