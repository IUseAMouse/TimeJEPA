# @package _global_
#
# Cross-resolution JEPA arm: scale equivariance through the objective.
#
#   # 0. mixed corpus (the 8192 chunks are essential, see below). Target
#   #    synthetic batch share ~9%: with the sampler weight size**0.5, 100k
#   #    chunks/family gave 19.3% and 20k/family give ~9.5%; the balance
#   #    audit decides.
#   python scripts/generate_synthetic.py --out data/processed/synthetic \
#       --chunks-per-family 20000
#   python scripts/prepare_chronos.py --out data/processed/chronos_extras
#   mkdir -p data/processed/lotsa_xres
#   # base = the better of lotsa_full (10B) and lotsa. Example with lotsa_full:
#   ln -s $(pwd)/data/processed/lotsa_full/*.npy data/processed/lotsa_xres/
#   ln -s $(pwd)/data/processed/synthetic/*.npy data/processed/lotsa_xres/
#   ln -s $(pwd)/data/processed/chronos_extras/*.npy data/processed/lotsa_xres/
#
#   # 1. corpus control (one variable at a time): lotsa_tiny baseline on the
#   #    same mixed directory, CLI override, no extra config
#   python scripts/train.py --config-name lotsa_tiny \
#       data.data_dir=data/processed/lotsa_xres wandb.run_name=xres-control
#
#   # 2. the arm
#   python scripts/train.py --config-name lotsa_tiny_xres wandb.run_name=xres-pretrain
#
#   # 3. zero-shot finetune + evals: standard protocol (lotsa_tiny_zeroshot
#   #    with pretrained_encoder_path to this pretrain; w_film, zero-init on
#   #    the query side, travels in the checkpoint and equals identity at w=1,
#   #    and the finetune never passes w).
#
# Mechanism: context read decimated at k1, target (the physically contiguous
# future) decimated at k2, k1 and k2 drawn independently from
# multi_resolution_factors; the predictor receives w = k2/k1 per item via a
# zero-init residual FiLM on its future queries. The objective forces the
# latent space to be transposable across scales, which FlowState gets by
# construction (SSM, delta_bar = s*delta, arXiv:2508.05287) at the cost of
# receiving seasonality from outside. Here the equivariance is learned, and
# it is only feasible because the target is a latent: two resolutions do not
# have the same values, so a reconstruction loss has no common target.
#
# Equivariance, not invariance: a 5-min series and its hourly decimation
# differ, and demanding the same latent would destroy information. Hence
# conditioning on w rather than an equality constraint. The control
# (lotsa_tiny_mix) also adopts standalone targets, so xres-vs-mix carries
# one variable, the objective.
#
# Deviations from lotsa_tiny:
# 1. contextualized_targets: false, required: the contextualized target
#    concatenates [context||target] in sample steps, which is wrong when the
#    two grids differ. Guarded by a ValueError in the module.
# 2. The mixed corpus (lotsa + synthetic + chronos_extras). LOTSA chunks are
#    2048 steps: ctx*k1 + pred*k2 <= 2048 only allows k1=1 pairs
#    (1024 + 256*k2 <= 2048 -> k2 <= 4); k1>1 requires the 8192 chunks. The
#    wandb line `aug/w_neq1_frac` is the witness: if it stays at 0, the run
#    measures nothing. Comparing to bare lotsa_tiny would change two
#    variables (objective + corpus); the control run (command 1) restores
#    the one-variable comparison.
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_tiny_xres"
  # A single key drives model (FiLM), module (reading w) and datamodule
  # (k1/k2 pairs), wired that way in train.py so they cannot diverge.
  cross_resolution: true
  # Same scaler as the control (lotsa_tiny_mix), otherwise xres-vs-mix
  # would compare two variables.
  robust_scale: true

training:
  # LR cap 3e-4 (tiny.yaml inherits 7.5e-4): at high LR the online encoder
  # outruns the EMA teacher and the latent targets drift, and the tiny-full
  # pretrain showed a late contraction of effective rank (47 -> 37). Shared
  # by mix and xres so their comparison stays clean.
  optimizer:
    learning_rate: 3.0e-4
  contextualized_targets: false
  # 2 epochs as a budget cap, aligned with the mix control. The cosine spans
  # both: stopping at epoch 1 leaves the LR at ~50% of max, not annealed.
  max_epochs: 2

trainer:
  val_check_interval: 0.05

early_stopping:
  enabled: false

data:
  # Re-enabled for this arm (lotsa_tiny disables it).
  multi_resolution_factors: [1, 2, 4]
  p_multi_resolution: 0.3
  data_dir: "data/processed/lotsa_xres"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
    - "cross-resolution"
