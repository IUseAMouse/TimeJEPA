# @package _global_
#
# G5 - FINETUNE on MONASH of an encoder pretrained on LOTSA.
#      ALTERNATIVE ARM - see lotsa_tiny_zeroshot for the main protocol.
#
# WARNING - KNOWN CONTAMINATION. The Monash corpus contains the evaluation
# benchmarks: `electricity-hourly` IS the Nixtla `electricity` (5260/26304 =
# the last 20%), `traffic-hourly` IS `traffic` (3508/17544). The
# train/val/test split is sequential on per-series grouped indices, so this
# finetune sees those series over their whole span, WITH supervised targets.
# The traffic and electricity numbers from this arm are therefore NOT
# publishable - it serves as an upper bound ("what domain adaptation would
# give"), not as a result.
#
#   python scripts/train.py --config-name lotsa_tiny_finetune \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_tiny/pretrain_True/<ckpt>"' \
#       wandb.run_name=lotsa-quantile
#
#   python scripts/evaluate.py --config-name lotsa_tiny_finetune \
#       +checkpoint_path=checkpoints/timejepa_lotsa_tiny_ft/pretrain_False/<ckpt>
#
# The finetune goes back to the MONASH corpus, not LOTSA
# -------------------------------------------------
# It is the foundation-model scheme (Moirai, Chronos): pretrain broad, adapt
# on the domain. It is also the reading E12 imposes - pretraining pays in
# TRANSFER, so the downstream domain must be distinct from the pretrain
# corpus for the gain to be visible. Finetuning on LOTSA itself would
# reproduce exactly the E8 setup, where a tie was the default outcome.
#
# The comparison that matters
# -------------------------
# Against `tiny_geo` finetuned identically (same geometry, same downstream
# corpus, same mode): the ONLY variable is the pretrain corpus, Monash vs
# LOTSA. It is the direct measure of "does scaling the pretraining pay?".
#
# Also evaluate in the low-data regime, with `tiny_geo_lowdata`: E12 measured
# -8.7% there for the Monash pretrain. If LOTSA widens that gap, G5's
# prediction is confirmed; if it does not move it, the ceiling is not in the
# data and that is information at least as useful.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_lotsa_tiny_ft"

training:
  mode: "finetune"
  # Same mode as the E11/E12 arms, so the numbers compare.
  finetune_mode: "full_finetune"

# data inherits entirely from tiny_geo: Monash corpus, 24 datasets, no mmap.
# Nothing to redeclare - and above all not data_dir, which would otherwise
# point to LOTSA.

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "finetune"
