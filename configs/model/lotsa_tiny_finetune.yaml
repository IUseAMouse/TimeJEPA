# @package _global_
#
# Finetune on Monash of an encoder pretrained on LOTSA. Alternative arm; see
# lotsa_tiny_zeroshot for the main protocol.
#
# Known contamination: the Monash corpus contains the evaluation benchmarks.
# `electricity-hourly` is the Nixtla `electricity` (5260/26304 = the last
# 20%), `traffic-hourly` is `traffic` (3508/17544). The train/val/test split
# is sequential on per-series grouped indices, so this finetune sees those
# series over their whole span with supervised targets. The traffic and
# electricity numbers from this arm are not publishable; the arm serves as
# an upper bound on domain adaptation.
#
#   python scripts/train.py --config-name lotsa_tiny_finetune \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_tiny/pretrain_True/<ckpt>"' \
#       wandb.run_name=lotsa-quantile
#
#   python scripts/evaluate.py --config-name lotsa_tiny_finetune \
#       +checkpoint_path=checkpoints/timejepa_lotsa_tiny_ft/pretrain_False/<ckpt>
#
# The finetune goes back to the Monash corpus, as in the foundation-model
# scheme (Moirai, Chronos): pretrain broad, adapt on the domain. Pretraining
# pays in transfer, so the downstream domain must be distinct from the
# pretrain corpus for the gain to be visible.
#
# The comparison that matters is against `tiny_geo` finetuned identically
# (same geometry, same downstream corpus, same mode): the only variable is
# the pretrain corpus, Monash vs LOTSA. Also evaluate in the low-data regime
# with `tiny_geo_lowdata`, where the Monash pretrain gave -8.7% MASE.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_lotsa_tiny_ft"

training:
  mode: "finetune"
  # Same mode as the earlier finetune arms, so the numbers compare.
  finetune_mode: "full_finetune"

# data inherits entirely from tiny_geo: Monash corpus, 24 datasets, no mmap.
# Do not redeclare data_dir, which would otherwise point to LOTSA.

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "finetune"
