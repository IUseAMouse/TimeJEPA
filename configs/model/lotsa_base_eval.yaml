# @package _global_
#
# Zero-shot evaluation, base scale.
#
#   python scripts/evaluate.py --config-name lotsa_base_eval \
#       +checkpoint_path=checkpoints/timejepa_lotsa_base_zs/pretrain_False/<ckpt>
#
# Geometry and capacity of the trained model, but evaluation data (Monash
# corpus). Neither `lotsa_base` nor `lotsa_base_zeroshot` fits: their
# `data_dir` points to LOTSA, so the "local datasets" section would run on
# the training corpus.
#
# As for `lotsa_tiny_eval`: the "Nixtla" section is fully zero-shot, the
# "Local datasets" section is not for seven entries (london-smart-meters,
# bitcoin, wind-farms-minutely, rideshare, fred-md, sunspot-daily,
# melbourne-pedestrian-count) which have a kept equivalent in LOTSA. The
# Nixtla numbers are the publishable ones.
#
# A test locks geometry and capacity to `lotsa_base_zeroshot`: at evaluation
# an incompatible shape only warns before outputting wrong numbers.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_lotsa_base_zs"
  encoder:
    d_model: 384
    n_heads: 8
    n_layers: 8
    d_ff: 1536
  predictor:
    d_model: 384
    n_heads: 8
    n_layers: 4
    d_ff: 1536
  decoder:
    d_model: 384
    hidden_dim: 768
    n_layers: 4

wandb:
  tags:
    - "base"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "zeroshot"
    - "eval"
