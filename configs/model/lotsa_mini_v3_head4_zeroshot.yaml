# @package _global_
# Head-width arm: same pretrain, quantile-head MLP x4.
#
# Motive: the quantile head is the only component born at finetune (JEPA
# gives it no gradient) and the only one whose share shrinks with scale
# (10.4% of tiny, 7.3% of mini). Widening it costs nothing at pretrain.
# One variable: decoder.quantile_hidden_dim 192 (d_model fallback) -> 768.
#
#   python scripts/train.py --config-name lotsa_mini_v3_head4_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_mini_v3/pretrain_True/epoch00_valloss0.5495.ckpt"'
defaults:
  - lotsa_mini_v3_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_mini_v3_head4_zs"
  decoder:
    quantile_hidden_dim: 768

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "head4", "robust-scale"]
