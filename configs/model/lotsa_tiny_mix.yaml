# @package _global_
#
# RUN A - "MIXED CONTROL": corpus (winning base + synthetic + chronos)
# + robust arcsinh scaler (G8.4). Baseline of the xres arm.
#
#   python scripts/train.py --config-name lotsa_tiny_mix wandb.run_name=mix-control
#   # then: lotsa_tiny_mix_zeroshot (finetune) and lotsa_tiny_mix_eval (evals)
#
# BUNDLING DECISION (user, 2026-08-20, limited compute): this run bundles
# THREE changes vs tiny-full - mixed corpus (symlinks), arcsinh scaler, and it
# serves as the control for xres. We give up isolating synthetic / chronos /
# arcsinh from each other (chronos ~0.5% of the corpus, never measurable
# alone; arcsinh judged "not worth a dedicated run"). What STAYS isolable:
#   * mix vs tiny-full  = mixed corpus + arcsinh + standalone targets +
#     2-epoch finetune, as a package (each item listed in E18);
#   * xres vs mix       = the cross-resolution OBJECTIVE, ONE variable - made
#     true by the 2026-08-20 audit: mix ALSO adopts contextualized_targets:false
#     (forced on the xres side by the physics of the two grids), otherwise the
#     comparison carried two settings. The cost (standalone EMA target: the
#     target encoder sees 31 patches while the online one sees 127) is paid by
#     BOTH arms - measured, not dodged.
#
# The scaler (components/robust_scale.py): arcsinh((x-median)/MAD) on input,
# sinh on output, RevIN intact in the middle. Expected: heavy-tailed configs
# (bitbrains 3.6-6.0 MASE, car_parts CRPS>1, bizitobs) - the "domain" half of
# E17. The checkpoint self-describes (robust_scaler.is_robust marker): any
# flag/checkpoint mismatch is refused at load time (P3.2).
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_tiny_mix"
  robust_scale: true

training:
  # LR cap 3e-4 (decision 2026-08-21, inherited: 7.5e-4 from tiny.yaml).
  # Two supports: (a) mechanistic - at high LR the online encoder outruns the
  # EMA teacher and the latent targets drift constantly, the hard objective is
  # paid twice; (b) the tiny-full pretrain showed a late contraction of
  # effective rank (47 -> 37 over the last quarter), to watch here. No
  # ablation (1 day/run): shared by mix AND xres, so their duel stays clean;
  # one more bundle item vs tiny-full (E18+).
  optimizer:
    learning_rate: 3.0e-4
  # 2 epochs (decision 2026-08-21): budget cap rather than strict
  # single-pass - cut by hand if the second epoch looks useless.
  # The cosine spans 2 epochs: a manual stop at the end of epoch 1 leaves the
  # LR at ~50% of max, not annealed (same artifact as tiny-full's midway
  # checkpoint) - keep in mind when comparing to tiny-full, which was annealed
  # over exactly 1 epoch.
  max_epochs: 2
  # Audit 2026-08-20 (C1): aligned with xres so the xres-vs-mix duel carries
  # only one variable. See the header.
  contextualized_targets: false

trainer:
  val_check_interval: 0.05

early_stopping:
  enabled: false

data:
  data_dir: "data/processed/lotsa_xres"

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "pretrain", "mix-control", "robust-scale"]
