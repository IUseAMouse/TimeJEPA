# @package _global_
#
# Mixed control: corpus (base + synthetic + chronos) + robust arcsinh scaler.
# Baseline of the xres arm.
#
#   python scripts/train.py --config-name lotsa_tiny_mix wandb.run_name=mix-control
#   # then: lotsa_tiny_mix_zeroshot (finetune) and lotsa_tiny_mix_eval (evals)
#
# This run bundles three changes vs tiny-full (mixed corpus via symlinks,
# arcsinh scaler, standalone targets) because compute was limited; chronos is
# ~0.5% of the corpus and never measurable alone. What stays isolable:
#   * mix vs tiny-full  = the package above plus the 2-epoch finetune;
#   * xres vs mix       = the cross-resolution objective, one variable. mix
#     also adopts contextualized_targets: false (forced on the xres side by
#     the two grids), so the cost of standalone EMA targets (the target
#     encoder sees 31 patches while the online one sees 127) is paid by both.
#
# The scaler (components/robust_scale.py): arcsinh((x-median)/MAD) on input,
# sinh on output, RevIN intact in the middle. Expected to help heavy-tailed
# configs (bitbrains, car_parts, bizitobs). The checkpoint self-describes
# (robust_scaler.is_robust marker): any flag/checkpoint mismatch is refused
# at load time.
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_tiny_mix"
  robust_scale: true

training:
  # LR cap 3e-4 (tiny.yaml inherits 7.5e-4): at high LR the online encoder
  # outruns the EMA teacher and the latent targets drift, and the tiny-full
  # pretrain showed a late contraction of effective rank (47 -> 37). Shared
  # by mix and xres so their comparison stays clean.
  optimizer:
    learning_rate: 3.0e-4
  # 2 epochs as a budget cap. The cosine spans both: a manual stop at the end
  # of epoch 1 leaves the LR at ~50% of max, not annealed, unlike tiny-full
  # which was annealed over exactly 1 epoch.
  max_epochs: 2
  # Aligned with xres so the xres-vs-mix comparison carries one variable.
  contextualized_targets: false

trainer:
  val_check_interval: 0.05

early_stopping:
  enabled: false

data:
  data_dir: "data/processed/lotsa_xres"

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "pretrain", "mix-control", "robust-scale"]
