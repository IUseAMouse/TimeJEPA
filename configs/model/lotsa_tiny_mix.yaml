# @package _global_
#
# RUN A — « CONTRÔLE MIXTE » : corpus (base gagnante + synthétique + chronos)
# + scaler robuste arcsinh (G8.4). Baseline de l'arm xres.
#
#   python scripts/train.py --config-name lotsa_tiny_mix wandb.run_name=mix-control
#   # puis : lotsa_tiny_mix_zeroshot (finetune) et lotsa_tiny_mix_eval (évals)
#
# ⚠️ DÉCISION DE BUNDLING (utilisateur, 2026-08-20, compute limité) : ce run
# regroupe TROIS changements vs tiny-full — corpus mixte (symlinks), scaler
# arcsinh, et il sert de contrôle à xres. On renonce à isoler synthétique /
# chronos / arcsinh entre eux (chronos ~0,5 % du corpus, jamais mesurable seul ;
# arcsinh jugé « pas digne d'un run dédié »). Ce qu'on GARDE d'isolable :
#   * mix vs tiny-full  = corpus mixte + arcsinh + cibles standalone + finetune
#     2 époques, en paquet (chaque item listé dans E18) ;
#   * xres vs mix       = l'OBJECTIF inter-résolution, UNE variable — rendu vrai
#     par l'audit du 2026-08-20 : mix adopte AUSSI contextualized_targets:false
#     (imposé côté xres par la physique des deux grilles), sinon la comparaison
#     portait deux réglages. Le coût (cible EMA standalone : l'encodeur cible
#     voit 31 patchs quand l'online en voit 127) est payé par les DEUX arms —
#     mesuré, pas contourné.
#
# Le scaler (components/robust_scale.py) : arcsinh((x−médiane)/MAD) en entrée,
# sinh en sortie, RevIN intact au milieu. Attendu : les configs à queues
# lourdes (bitbrains 3,6-6,0 MASE, car_parts CRPS>1, bizitobs) — la moitié
# « domaine » d'E17. Le checkpoint s'auto-décrit (marqueur robust_scaler.is_robust) :
# tout mismatch flag/checkpoint est refusé au chargement (P3.2).
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_tiny_mix"
  robust_scale: true

training:
  # Plafond LR 3e-4 (décision utilisateur 2026-08-21, hérité : 7.5e-4 de
  # tiny.yaml). Deux appuis : (a) mécanistique — à LR élevé l'encodeur online
  # distance le teacher EMA et les cibles latentes dérivent en permanence, on
  # paie l'objectif difficile deux fois ; (b) le pretrain tiny-full a montré
  # une contraction tardive du rang effectif (47 -> 37 sur le dernier quart), à
  # surveiller ici. Pas d'ablation (1 j/run) : partagé par mix ET xres, donc
  # leur duel reste propre ; item de bundle de plus vs tiny-full (E18+).
  optimizer:
    learning_rate: 3.0e-4
  # 2 époques (décision utilisateur 2026-08-21) : budget-plafond plutôt que
  # passe-unique strict — l'utilisateur coupe à la main s'il juge la seconde
  # époque inutile. Le cosinus s'étale sur 2 époques : un arrêt manuel à la fin
  # de l'époque 1 laisse le LR à ~50 % du max, pas recuit (même artefact que le
  # checkpoint mi-parcours de tiny-full) — à garder en tête en comparant à
  # tiny-full, qui a été recuit sur 1 époque exactement.
  max_epochs: 2
  # Audit 2026-08-20 (C1) : aligné sur xres pour que le duel xres-vs-mix ne
  # porte qu'une variable. Voir l'en-tête.
  contextualized_targets: false

trainer:
  val_check_interval: 0.05

early_stopping:
  enabled: false

data:
  data_dir: "data/processed/lotsa_xres"

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "pretrain", "mix-control", "robust-scale"]
