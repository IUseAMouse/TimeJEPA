# @package _global_
#
# G5 - FINETUNE ON LOTSA, base scale. Zero-shot protocol.
#
#   python scripts/train.py --config-name lotsa_base_zeroshot \
#       trainer.accumulate_grad_batches=6 \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_base/pretrain_True/<ckpt>"'
#
# The decoder is trained only on LOTSA: Monash and Nixtla stay unseen at ALL
# stages, which makes the evaluation comparable to Chronos / Moirai /
# TimesFM / Toto. See `lotsa_tiny_zeroshot` for the full reasoning.
defaults:
  - lotsa_base
  - _self_

model:
  name: "timejepa_lotsa_base_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"

data:
  datasets_finetune: null

wandb:
  tags:
    - "base"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "zeroshot"
