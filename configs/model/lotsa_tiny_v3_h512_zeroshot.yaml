# @package _global_
# H512 on the v3 lineage, without a new pretrain: the h512 design is a
# finetune lever via grow_future_query_table, so one v3 pretrain feeds both
# the h256 and h512 finetunes and the gap measures the lever.
#
#   python scripts/train.py --config-name lotsa_tiny_v3_h512_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_tiny_v3/pretrain_True/<latest named ckpt>"'
#
# Mechanics: see lotsa_tiny_h512_zeroshot.yaml (same deltas, only the base
# changes). Expected: medium/long down, short unchanged.
# Finetune window 1024+512 = 1536: the 1280 chunks (lotsa_short) leave the
# finetune; read the "skipped" line at setup.
defaults:
  - lotsa_tiny_v3_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_tiny_v3_h512_zs"
  prediction_length: 512

training:
  extend_horizon_queries: true
  horizon_lengths: [64, 96, 128, 192, 256, 384, 512]
  p_random_horizon: 0.5

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "h512", "robust-scale"]
