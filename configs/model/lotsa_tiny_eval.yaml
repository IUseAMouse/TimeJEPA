# @package _global_
#
# G5 — ÉVALUATION ZERO-SHOT d'un modèle entraîné intégralement sur LOTSA.
#
#   python scripts/evaluate.py --config-name lotsa_tiny_eval \
#       +checkpoint_path=checkpoints/timejepa_lotsa_tiny_zs/pretrain_False/<ckpt>
#
# Pourquoi une config d'éval séparée
# ----------------------------------
# Ni `lotsa_tiny` ni `lotsa_tiny_zeroshot` ne conviennent : leur `data.data_dir`
# pointe sur LOTSA, donc l'évaluation « datasets locaux » porterait sur le corpus
# d'ENTRAÎNEMENT — l'exact contraire de ce qu'on veut mesurer.
#
# `tiny_geo` conviendrait par coïncidence (même géométrie, données Monash), mais
# c'est un couplage fragile : le jour où l'une des deux géométries bouge, l'éval
# chargerait un checkpoint de forme incompatible. Or à l'évaluation une géométrie
# fausse ne fait que WARNER (`re-initialising patching.*`) et sort des chiffres
# silencieusement faux — le piège déjà rencontré sur l'arm p32.
#
# Cette config rend l'intention explicite, et un test vérifie que sa géométrie
# reste identique à celle de `lotsa_tiny` : si les deux divergent, le test casse
# au lieu de l'évaluation.
#
# Ce qui est du VRAI zero-shot ici, et ce qui ne l'est pas
# -------------------------------------------------------
# ✅ **La section « Nixtla Long-Horizon Benchmarks » est intégralement zero-shot.**
#    Vérifié sur la sortie réelle de `make lotsa-list` (2026-08-13) : la
#    conversion exclut ett1, ett2, electricity_15min, traffic_hourly,
#    traffic_weekly, Q-TRAFFIC, weather, oikolab_weather, ainsi que les 28
#    répertoires GIFT-Eval. C'est la section qui porte les chiffres publiables et
#    les rend comparables à Chronos / Moirai / TimesFM / Toto.
#
# ⚠️ **La section « Local datasets » ne l'est PAS entièrement.** Elle évalue sur
#    le corpus Monash, dont plusieurs entrées ont un équivalent RETENU dans LOTSA :
#
#      london-smart-meters        <- london_smart_meters_with_missing
#      bitcoin                    <- bitcoin_with_missing
#      wind-farms-minutely        <- wind_farms_with_missing, wind_power
#      rideshare                  <- rideshare_with_missing
#      fred-md                    <- fred_md
#      sunspot-daily              <- sunspot_with_missing
#      melbourne-pedestrian-count <- pedestrian_counts
#
#    Ces lignes-là sont donc de l'IN-DOMAINE, pas du zero-shot, et ne doivent pas
#    être présentées comme telles. Les autres entrées locales (electricity-hourly,
#    traffic-hourly, m4-hourly, nn5-daily, solar-10-minute, saugeenday,
#    australian-electricity-demand, us-births, rain-temperature,
#    wikipedia-web-traffic) sont couvertes par l'exclusion et restent zero-shot.
#
#    Pourquoi ne pas curer la liste : il faudrait maintenir une correspondance
#    Monash↔LOTSA exhaustive, alias compris, et une omission produirait
#    silencieusement une revendication zero-shot fausse. Documenter est plus sûr
#    que prétendre à une complétude non garantie.
defaults:
  - tiny_geo
  - _self_

model:
  # Le checkpoint est fourni explicitement à l'éval ; ce nom ne sert qu'à ranger
  # les sorties (plots, tableaux) sous un répertoire lisible.
  name: "timejepa_lotsa_tiny_zs"

# data hérite de tiny_geo : corpus Monash, use_mmap absent (donc False).
# C'est voulu — ces données sont la CIBLE de l'évaluation, pas de l'entraînement.

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "zeroshot"
    - "eval"
