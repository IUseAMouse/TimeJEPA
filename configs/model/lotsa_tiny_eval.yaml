# @package _global_
#
# Zero-shot evaluation of a model trained entirely on LOTSA.
#
#   python scripts/evaluate.py --config-name lotsa_tiny_eval \
#       +checkpoint_path=checkpoints/timejepa_lotsa_tiny_zs/pretrain_False/<ckpt>
#
# Why a separate eval config: neither `lotsa_tiny` nor `lotsa_tiny_zeroshot`
# fits, their `data.data_dir` points to LOTSA, so the "local datasets"
# evaluation would run on the training corpus. `tiny_geo` fits by
# coincidence (same geometry, Monash data), but the day one geometry moves
# the eval would load a checkpoint of incompatible shape, and at evaluation
# a wrong geometry only warns (`re-initialising patching.*`) and outputs
# wrong numbers. A test verifies this config's geometry stays identical to
# `lotsa_tiny`'s.
#
# What is zero-shot here: the "Nixtla Long-Horizon Benchmarks" section is
# fully zero-shot (the conversion excludes ett1, ett2, electricity_15min,
# traffic_hourly, traffic_weekly, Q-TRAFFIC, weather, oikolab_weather, plus
# the 28 GIFT-Eval directories); those are the publishable numbers,
# comparable to Chronos / Moirai / TimesFM / Toto.
#
# The "Local datasets" section is not entirely zero-shot: it evaluates on
# the Monash corpus, and these entries have a kept equivalent in LOTSA:
#
#      london-smart-meters        <- london_smart_meters_with_missing
#      bitcoin                    <- bitcoin_with_missing
#      wind-farms-minutely        <- wind_farms_with_missing, wind_power
#      rideshare                  <- rideshare_with_missing
#      fred-md                    <- fred_md
#      sunspot-daily              <- sunspot_with_missing
#      melbourne-pedestrian-count <- pedestrian_counts
#
# Those lines are in-domain and must not be presented as zero-shot. The other
# local entries are covered by the exclusion. The list is not curated out of
# the eval because an exhaustive Monash-LOTSA mapping, aliases included, is
# hard to maintain and one omission would produce a false zero-shot claim.
defaults:
  - tiny_geo
  - _self_

model:
  # The checkpoint is passed explicitly at eval; this name only serves to file
  # the outputs (plots, tables) under a readable directory.
  name: "timejepa_lotsa_tiny_zs"

# data inherits from tiny_geo: Monash corpus, use_mmap absent (so False).
# This data is the target of the evaluation, not of training.

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "zeroshot"
    - "eval"
