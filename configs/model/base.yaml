# @package _global_
# configs/model/timejepa_base.yaml

model:
  name: "timejepa_base"
  
  seq_length: 512
  patch_length: 4
  stride: 4
  num_channels: 1
  prediction_length: 128
  
  encoder:
    d_model: 384
    n_heads: 8
    n_layers: 8
    d_ff: 1536
    dropout: 0.1
    activation: "gelu"
    use_revin: true
    use_rope: true
    norm_first: true
  
  predictor:
    type: "transformer"
    d_model: 384
    n_heads: 8
    n_layers: 4
    d_ff: 1536
    dropout: 0.1
    activation: "gelu"
  
  decoder:
    type: "mlp"
    d_model: 384
    hidden_dim: 768
    n_layers: 4
    dropout: 0.1
  
  target_encoder:
    momentum_schedule: "cosine"
    momentum_base: 0.996
    momentum_final: 1.0
  
  params_millions: ~25

training:
  mode: "pretrain"
  finetune_mode: "gradual_unfreeze"
  unfreeze_after_epoch: 1
  
  loss:
    type: "vicreg"
    finetune_type: "huber"
    smooth_l1_beta: 1.0
    variance_loss_weight: 0.0
    covariance_loss_weight: 0.0
  
  optimizer:
    name: "adamw"
    learning_rate: 5.0e-4  # Réduit pour stabilité
    weight_decay: 0.05
    betas: [0.9, 0.95]
    eps: 1.0e-8
    encoder_lr_multiplier: 1.0
  
  lr_scheduler:
    type: "cosine"
    warmup_epochs: 0.15  # Plus de warmup
    min_lr: 1.0e-6
  
  max_epochs: 25
  
  ema:
    enabled: true
    momentum_base: 0.998
    momentum_final: 1.0
    schedule: "cosine"
  
  dropout: 0.1
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  log_histograms: false

data:
  data_dir: "data/processed/"
  checkpoint_dir: "checkpoints/"
  output_dir: "lightning/"
  datasets: [] # This load alls
  datasets_finetune: ["electricity", "m4_hourly", "australian-electricity-demand", "melbourne-pedestrian-count", "london-smart-meters"]
  datasets_eval: ["electricity", "m4_hourly"]
  combine_mode: "concatenate"
  batch_size: 384  # Réduit pour VRAM
  stride: 8
  normalize_mode: "global"
  normalizer_type: "identity"
  clip_outliers: false
  clip_sigma: 5.0
  balanced_sampling: true
  sampling_temperature: 0.5
  max_oversample_ratio: 8.0
  train_val_test_split: [0.96, 0.02, 0.02]
  seed: 420

nixtla:
  - ettm1
  - ettm2
  - etth1
  - etth2
  - electricity
  - exchange
  - traffic
  - ili
  - weather

horizons: [96, 192, 336, 720]

augmentations:
  pretrain:
    enabled: true
    scale_enabled: true
    scale_range: [0.5, 2.0]
    scale_log_uniform: true
    p_scale: 0.5
    jitter_enabled: true
    jitter_std: 0.03
    jitter_relative: true
    p_jitter: 0.3
    magnitude_warp_enabled: true
    magnitude_warp_sigma: 0.2
    magnitude_warp_knots: 4
    p_magnitude_warp: 0.3
    drs_enabled: true
    drs_factors: [2, 3, 4]
    drs_interpolation: "linear"
    p_drs: 0.15
    trend_enabled: true
  
  finetune:
    enabled: true
    scale_enabled: true
    scale_range: [0.8, 1.25]
    p_scale: 0.3
    jitter_enabled: true
    jitter_std: 0.01
    p_jitter: 0.2
    magnitude_warp_enabled: false
    drs_enabled: false
    trend_enabled: false

checkpoint:
  monitor: "val_loss"
  mode: "min"
  save_top_k: 3
  save_last: true
  filename: "epoch{epoch:02d}_val_loss{val_loss:.4f}"
  auto_insert_metric_name: false

early_stopping:
  enabled: true
  monitor: "val_loss"
  patience: 5
  mode: "min"
  min_delta: 0.0001

trainer:
  accelerator: "auto"
  devices: -1
  precision: "bf16-mixed"
  max_epochs: ${training.max_epochs}
  gradient_clip_val: ${training.gradient_clip_val}
  accumulate_grad_batches: 8  # Compense batch_size réduit
  val_check_interval: 0.05
  log_every_n_steps: ${training.log_every_n_steps}
  deterministic: false
  strategy: "ddp_find_unused_parameters_true"
  enable_progress_bar: true
  enable_model_summary: true
  use_distributed_sampler: false

wandb:
  project: "TimeJEPA"
  entity: "iuseamouse"
  run_name: null
  tags:
    - "base"
    - "jepa_tst"
    - "v1"
    - "pytorch-lightning"
  log_model: true
  log_gradients: false
  log_freq: 100