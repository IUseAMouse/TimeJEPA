# @package _global_

model:
  name: "jepa_tst_base"
  
  seq_length: 512
  patch_length: 16
  stride: 8
  num_channels: 1
  prediction_length: 96
  
  encoder:
    d_model: 512
    n_heads: 8
    n_layers: 6
    d_ff: 2048
    dropout: 0.1
    activation: "gelu"
    use_revin: true
    use_rope: true
    norm_first: true
  
  predictor:
    type: "transformer"
    d_model: 512
    n_heads: 8
    n_layers: 4
    d_ff: 2048
    dropout: 0.1
    activation: "gelu"
  
  decoder:
    type: "mlp"
    d_model: 512
    hidden_dim: 1024
    n_layers: 3
    dropout: 0.1
  
  target_encoder:
    momentum_schedule: "cosine"
    momentum_base: 0.996
    momentum_final: 1.0
  
  params_millions: ~15


training:
  mode: "pretrain"
  
  # Masking strategy
  masking:
    strategy: "temporal"  # random | block | temporal | random_temporal
    context_ratio: 0.7
    n_context_blocks: 4
    context_block_length: 3
    n_target_blocks: 2
    target_block_length: 3
    scale: [0.15, 0.25]  # Min/max scale for random masking
  
  # Loss configuration
  loss:
    type: "mse"  # mse | smooth_l1 | cosine
    smooth_l1_beta: 1.0
    variance_loss_weight: 0.0
    covariance_loss_weight: 0.0
  
  # Optimization
  optimizer:
    name: "adamw"
    learning_rate: 1.0e-3
    weight_decay: 0.05
    betas: [0.9, 0.95]
    eps: 1.0e-8
  
  # Learning rate schedule
  lr_scheduler:
    type: "cosine"  # cosine | linear | constant
    warmup_epochs: 10
    min_lr: 1.0e-6
  
  # Training duration
  max_epochs: 200
  
  # EMA configuration
  ema:
    enabled: true
    momentum_base: 0.996
    momentum_final: 1.0
    schedule: "cosine"
  
  # Regularization
  dropout: 0.1
  gradient_clip_val: 1.0
  
  # Logging
  log_every_n_steps: 50
  log_histograms: false  # Log weight histograms (expensive)

data:
  data_dir: "data/processed/"
  datasets: None, # This load alls
  combine_mode: "concatenate"
  batch_size: 64
  stride: 1
  normalize_mode: "global"
  normalizer_type: "identity"
  train_val_test_split: (0.8, 0.1, 0.1)
  seed: 420