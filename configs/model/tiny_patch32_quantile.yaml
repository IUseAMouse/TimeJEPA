# @package _global_
#
# Quantile head (decoder fed by the context).
#
# Finetune only. Only changes the decoder, so it reuses the existing pretrain
# checkpoint as is. Compare against the Huber finetune launched from the same
# checkpoint.
#
#   python scripts/train.py --config-name tiny_patch32_quantile \
#       training.mode=finetune \
#       +training.pretrained_encoder_path=<the same pretrain ckpt> \
#       wandb.run_name=p2-quantile
#
# Why non-parametric: GIFT-Eval ranks on CRPS, approximated by WQL, which is
# an average of pinball over a quantile grid. Predicting the grid optimizes
# the ranking metric directly, and no distribution shape is imposed (the
# datasets we lose on are noisy, asymmetric, heavy-tailed). MASE is based on
# MAE, minimized by the median; pinball gives the conditional median at q=0.5.
#
# Why the context feeds the decoder: the predictor is trained under MSE
# against the target latent, so it converges to E[z_target | z_context]
# (measured: pred_var 0.6 vs target_var 0.95). The dispersion information
# lives in the residual, which the model never sees at inference.
# Cross-attention to the context embeddings gives the decoder direct access
# to that signature. `scripts/probe_uncertainty.py` measures, on a given
# checkpoint, whether this brings something.
defaults:
  - tiny_patch32_ftall
  - _self_

model:
  name: "timejepa_tiny_patch32_quantile"
  decoder:
    type: "quantile"

training:
  loss:
    # Ignored when the decoder is probabilistic: the loss becomes pinball over
    # the whole grid.
    finetune_type: "huber"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "patch32"
    - "quantile-head"
