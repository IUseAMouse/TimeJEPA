# @package _global_
#
# P2.1 — tête quantile (option B : décodeur alimenté par le contexte)
#
# FINETUNE UNIQUEMENT. Ne change que le décodeur, donc réutilise tel quel le
# checkpoint de pretrain existant — aucun pretrain à relancer. À comparer au
# finetune Huber lancé depuis le MÊME checkpoint.
#
#   python scripts/train.py --config-name tiny_patch32_quantile \
#       training.mode=finetune \
#       +training.pretrained_encoder_path=<le même ckpt de pretrain> \
#       wandb.run_name=p2-quantile
#
# Pourquoi non paramétrique
# -------------------------
# GIFT-Eval classe sur le CRPS, approximé par le WQL — qui EST une moyenne de
# pinball sur une grille de quantiles. Prédire la grille optimise donc la
# métrique de classement sans intermédiaire. Et aucune forme de loi n'est
# imposée : les datasets sur lesquels on perd (exchange, bitcoin, ETTm) sont
# bruités, asymétriques, à queues lourdes.
#
# Bénéfice de bord sur MASE : elle est basée sur la MAE, minimisée par la
# MÉDIANE. Huber donne quelque chose entre moyenne et médiane ; le pinball donne
# la médiane conditionnelle exacte en q=0.5.
#
# Pourquoi le contexte alimente le décodeur (B plutôt que A)
# ----------------------------------------------------------
# Le prédicteur est entraîné sous MSE contre le latent cible : il converge vers
# E[z_cible | z_contexte], une moyenne conditionnelle par construction (mesuré
# en run réel : pred_var 0.6 contre target_var 0.95). L'information de
# dispersion vit dans le résidu, que le modèle ne voit jamais à l'inférence.
# Deux contextes de même moyenne conditionnelle mais de volatilités différentes
# peuvent donc se projeter au même endroit. La cross-attention vers les
# embeddings de contexte redonne au décodeur l'accès direct à cette signature.
#
# `scripts/probe_uncertainty.py` mesure, sur un checkpoint donné, si ça apporte
# réellement quelque chose — à lancer avant, pour savoir ce qu'on attend.
defaults:
  - tiny_patch32_ftall
  - _self_

model:
  name: "timejepa_tiny_patch32_quantile"
  decoder:
    type: "quantile"

training:
  loss:
    # Ignoré quand le décodeur est probabiliste : la loss devient le pinball sur
    # toute la grille. Le laisser explicite évite de croire que Huber s'applique.
    finetune_type: "huber"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "patch32"
    - "quantile-head"
