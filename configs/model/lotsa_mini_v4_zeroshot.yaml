# @package _global_
# CORPUS V4 finetune - short-series BOUNDARY WINDOWS (2026-09-05). The direct
# lever on the MASE bleeders: series shorter than ctx+pred now train in the
# exact condition evaluation imposes on them (prepare_context: flat left pad,
# few real context steps, short real target). The split point falls inside
# the real data; the context is left-padded by the row itself; the target
# keeps the real tail, is right-padded with its last value and MASKED out of
# the pinball beyond the real end. Never a fabricated observation inside the
# scored region.
#
# Cheapest possible test of the lever: finetune from the EXISTING mini v3
# pretrain val-best. Inherits the x8 quantile head (default recipe since
# 2026-09-05, champion 0.7914/0.5433), so the one variable is corpus v4 + the
# windows; the matched reference is the head8 25% checkpoint:
#
#   python scripts/train.py --config-name lotsa_mini_v4_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_mini_v3/pretrain_True/epoch00_valloss0.5495.ckpt"'
#   # eval: lotsa_mini_v4_eval (own output namespace)
#
# Witness at the first decile: aug/short_frac > 0 (share of batch items with
# a masked target) - if 0, the _reallen sidecar is missing and the arm is
# sterile. Predictions P-v4.1..3 recorded in the registry AT LAUNCH: the
# short-history configs (m4_yearly/quarterly/monthly/weekly, hospital,
# car_parts, covid) improve in MASE; long-history configs stable; aggregate
# flip+ratein vs the head8 25% champion (0.7914/0.5433) recorded then.
defaults:
  - lotsa_mini_v3_head8_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_mini_v4_zs"

data:
  data_dir: "data/processed/lotsa_v4"
  short_series_windows: true
  short_min_context: 16
  short_min_target: 4

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "v4", "short-series", "robust-scale"]
