# @package _global_
# Eval of the xres-v3 checkpoints (GIFT / Nixtla).
#
#   python scripts/evaluate_gift.py --config-name lotsa_tiny_xres_v3_eval \
#       '+checkpoint_path="checkpoints/timejepa_lotsa_tiny_xres_v3_zs/pretrain_False/<ckpt>"' +tta_flip=true
#
# cross_resolution MUST be carried: the FiLM is a predictor weight - without
# the flag, loading.py refuses (P3.2). The eval stays at w=1 (T2); the P-x.3
# surgery and the RateIN x w synergy will come via dedicated flags.
defaults:
  - lotsa_tiny_v3_eval
  - _self_

model:
  name: "timejepa_lotsa_tiny_xres_v3_zs"
  cross_resolution: true

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "eval", "v3", "xres", "robust-scale"]
