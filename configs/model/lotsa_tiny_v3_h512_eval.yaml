# @package _global_
# Eval of the v3-h512 checkpoints (GIFT / Nixtla).
#
#   python scripts/evaluate_gift.py --config-name lotsa_tiny_v3_h512_eval \
#       '+checkpoint_path="checkpoints/timejepa_lotsa_tiny_v3_h512_zs/pretrain_False/<ckpt>"' +tta_flip=true
#
# prediction_length 512: the checkpoint's query table is 63 patches, and
# without this override loading would refuse (geometry != checkpoint).
# Compare the medium/long terms to the twin h256 finetune (same pretrain);
# the gap measures the horizon lever.
defaults:
  - lotsa_tiny_v3_eval
  - _self_

model:
  name: "timejepa_lotsa_tiny_v3_h512_zs"
  prediction_length: 512
