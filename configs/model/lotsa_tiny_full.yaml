# @package _global_
#
# G5 — PRETRAIN sur le corpus LOTSA COMPLET (plafonds de conversion désactivés).
#
#   # 1. conversion sans plafonds — 80 à 150 Go, vérifier df -h d'abord
#   #    ⚠️ vers un répertoire NEUF, pas data/processed/lotsa. Voir ci-dessous.
#   python scripts/prepare_lotsa.py --out data/processed/lotsa_full \
#       --max-chunks-per-subset 1000000 --resume
#
#   # 2. pretrain
#   make train CONFIG=lotsa_tiny_full ARGS="wandb.run_name=lotsa-full"
#
# Pourquoi un répertoire SÉPARÉ, et pas une reconversion en place
# --------------------------------------------------------------
# `make lotsa-download` passe `--resume` en dur. Relancer avec un plafond plus
# haut sur data/processed/lotsa ne fait donc RIEN : tous les fichiers existent,
# tous sont sautés, et le script affiche « 0 morceaux » — ce qui se lit comme un
# échec alors que le corpus est simplement resté à sa taille d'origine.
#
# Mais la vraie raison est scientifique, pas ergonomique. data/processed/lotsa
# est le corpus sur lequel E14 a été obtenu, ET le corpus de contrôle de
# l'ablation d'objectif (lotsa_tiny_recon). L'écraser rendrait E14
# irreproductible et casserait la comparaison G6, qui n'a de sens que si les
# deux arms partagent exactement les mêmes données. Les deux corpus coexistent
# donc, et `--resume` reste utile ici : il permet de reprendre la conversion
# longue là où elle s'est arrêtée.
#
# Pourquoi ce régime existe
# -------------------------
# E13b : DEUX pretrains successifs (l'un à LR constant, l'autre recuit) désignent
# indépendamment leur meilleur checkpoint à ~250 k pas, soit environ UNE époque,
# et divergent ensuite — train qui descend, val qui monte. Le modèle épuise le
# corpus en une passe.
#
# Les 83 M de fenêtres du corpus plafonné sont trompeuses : elles proviennent de
# ~800 k morceaux distincts seulement (stride 8 sur des morceaux de 2048 produit
# 97 fenêtres largement redondantes par morceau). Le contenu réellement
# indépendant est bien plus petit que le compte de fenêtres ne le suggère.
#
# La réponse n'est donc pas plus d'époques, c'est plus de données distinctes.
#
# max_epochs = 1
# -------------
# Sur le corpus complet, une époque vaut déjà ~10x celle du corpus plafonné,
# soit plusieurs dizaines d'heures. Le scheduler cosinus étant étalé sur
# `max_epochs`, le laisser à 5 reproduirait exactement le défaut d'E13a : un LR
# qui ne décroît jamais. À 1, le recuit se fait sur la passe unique — ce qui est
# aussi le régime standard des modèles de fondation, entraînés une seule fois sur
# un corpus qu'ils ne revoient pas.
#
# ⚠️ Après la conversion, AUDITER l'équilibre avant de lancer. Sans les plafonds,
# rien ne garantit qu'une famille ne domine pas — c'est précisément le défaut
# qu'E10 avait mesuré sur Monash (deux datasets à 48,7 % du batch) :
#
#   python -c "
#   import numpy as np, glob, os, re
#   from collections import Counter
#   tot, files = Counter(), Counter()
#   for f in glob.glob('data/processed/lotsa_full/*.npy'):
#       fam = re.sub(r'_(18|19|20)\d{2}$', '', os.path.basename(f)[:-4])
#       a = np.load(f, mmap_mode='r'); tot[fam] += a.shape[0]*a.shape[1]; files[fam] += 1
#   g = sum(tot.values())
#   print(f'{g/1e9:.2f} Md observations, {sum(files.values())} fichiers')
#   for fam, n in tot.most_common(12): print(f'  {fam:<30} {100*n/g:5.1f} %  ({files[fam]} fichiers)')
#   "
#
# Aucune famille au-dessus de ~15 % : sinon, reconvertir celle-là avec un plafond
# (`--subsets <noms> --max-chunks-per-subset N`).
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_tiny_full"

data:
  # Corpus complet, dans son propre répertoire. `Path.glob` n'est PAS récursif
  # (datamodule.py:636), donc ce répertoire et data/processed/lotsa sont
  # strictement étanches — et tous deux le sont vis-à-vis des .npy Monash, qui
  # vivent un niveau au-dessus dans data/processed/.
  data_dir: "data/processed/lotsa_full"

training:
  max_epochs: 2

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
    - "full-corpus"
