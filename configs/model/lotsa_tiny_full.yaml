# @package _global_
#
# Pretrain on the full LOTSA corpus (conversion caps disabled).
#
#   # 1. conversion without caps: 80 to 150 GB, check df -h first.
#   #    Convert into a fresh directory, not data/processed/lotsa (see below).
#   python scripts/prepare_lotsa.py --out data/processed/lotsa_full \
#       --max-chunks-per-subset 1000000 --resume
#
#   # 2. pretrain
#   make train CONFIG=lotsa_tiny_full ARGS="wandb.run_name=lotsa-full"
#
# Why a separate directory: `make lotsa-download` hardcodes `--resume`, so
# re-running with a higher cap on data/processed/lotsa skips every existing
# file and prints "0 chunks". More importantly, data/processed/lotsa is the
# control corpus of the objective ablation (lotsa_tiny_recon), which only
# makes sense if both arms share the same data. The two corpora coexist, and
# `--resume` lets the long conversion pick up where it stopped.
#
# Why this regime: two successive pretrains on the capped corpus picked their
# best checkpoint at ~250k steps, about one epoch, then overfit. The 83M
# windows of the capped corpus come from only ~800k distinct chunks (stride 8
# on chunks of 2048 yields 97 largely redundant windows per chunk), so the
# answer is more distinct data, not more epochs.
#
# max_epochs = 1: on the full corpus one epoch is already ~10x the capped
# corpus. The cosine scheduler is stretched over `max_epochs`, so annealing
# happens over the single pass, the standard foundation-model regime.
#
# After conversion, audit the balance before launching: without the caps,
# nothing guarantees one family does not dominate.
#
#   python -c "
#   import numpy as np, glob, os, re
#   from collections import Counter
#   tot, files = Counter(), Counter()
#   for f in glob.glob('data/processed/lotsa_full/*.npy'):
#       fam = re.sub(r'_(18|19|20)\d{2}$', '', os.path.basename(f)[:-4])
#       a = np.load(f, mmap_mode='r'); tot[fam] += a.shape[0]*a.shape[1]; files[fam] += 1
#   g = sum(tot.values())
#   print(f'{g/1e9:.2f} B observations, {sum(files.values())} files')
#   for fam, n in tot.most_common(12): print(f'  {fam:<30} {100*n/g:5.1f} %  ({files[fam]} files)')
#   "
#
# No family above ~15%: otherwise reconvert that one with a cap
# (`--subsets <names> --max-chunks-per-subset N`).
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_tiny_full"

data:
  # Full corpus, in its own directory. `Path.glob` is not recursive, so this
  # directory, data/processed/lotsa and the Monash .npy files one level up
  # never mix.
  data_dir: "data/processed/lotsa_full"

training:
  # One epoch, the standard foundation-model regime (Chronos, TimesFM and
  # Moirai do one pass over a huge corpus). Repeating the same chunks overfits,
  # and `max_epochs` also drives the cosine: at 1, annealing ends with the
  # epoch, so the last checkpoint is the right one.
  #
  # "One epoch" is not "one pass over the corpus": `_compute_epoch_plan` sets
  # the epoch length to one pass over the largest file. On the full corpus
  # (anchor = buildings_900k, 10^6 chunks) the epoch is ~2.4 passes on
  # average, with era5 and cmip6 hitting the 3x cap; the 38 small files run
  # out around 48% of the epoch and the batch drops from 512 to ~463.
  max_epochs: 1

trainer:
  # 0.1 on an epoch of ~2M steps would only validate 10 times, the first after
  # ~200k steps. At 0.05 there are ~20 points, including one at ~100k steps;
  # validation is a fixed subset, so the cost stays marginal.
  val_check_interval: 0.05

early_stopping:
  # Disabled on single-pass runs: the cosine is stretched over `max_epochs: 1`,
  # so the model's value is at the end of the pass, when annealing completes.
  # Stopping early on a val_loss dip ships a model that was never annealed.
  enabled: false

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
    - "full-corpus"
