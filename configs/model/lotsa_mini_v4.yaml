# @package _global_
# Corpus v4 pretrain: v3 recipe, corpus re-prepared with the short series
# readmitted. prepare_lotsa v3 used --min-length 256, so every series shorter
# than that (m4_yearly ~30 steps, car_parts 51, hospital 84, tourism,
# m1/m3...) was absent from the corpus, exactly the configs where the MASE is
# worst. The v4 preparation lowers the floor and records the real length of
# every padded row in a sidecar (_reallen/<file>.npy, outside the '*.npy' glob):
#
#   # same runbook as v3, only the prepare step changes:
#   python scripts/prepare_lotsa.py --out data/processed/lotsa_v4 \
#       --min-length 24 --pad-to 2048
#
# With the sidecar, rows with fewer than ctx+pred real steps stop yielding
# sliding windows whose target lies in the flat left pad (in v3 a 256-step
# series padded to 2048 gave 65 such windows out of 97). The JEPA loss has no
# target mask, so short-series boundary windows are a finetune-only mechanism
# (lotsa_mini_v4_zeroshot).
#
#   python scripts/train.py --config-name lotsa_mini_v4 wandb.run_name=mini-v4
defaults:
  - lotsa_mini_v3
  - _self_

model:
  name: "timejepa_lotsa_mini_v4"

data:
  data_dir: "data/processed/lotsa_v4"

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "pretrain", "v4", "robust-scale"]
