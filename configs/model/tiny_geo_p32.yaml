# @package _global_
#
# PATCH 32/16 ARM of the geometry round. Identical to tiny_geo except patching.
#
#   python scripts/train.py    --config-name tiny_geo_p32 wandb.run_name=geo-p32
#   python scripts/train.py    --config-name tiny_geo_p32 training.mode=finetune \
#       +training.pretrained_encoder_path=checkpoints/timejepa_tiny_geo_p32/pretrain_True/<ckpt>
#   python scripts/evaluate.py --config-name tiny_geo_p32 \
#       +checkpoint_path=checkpoints/timejepa_tiny_geo_p32/pretrain_False/<ckpt>
#
# Why a config rather than two overrides
# ---------------------------------------------
# `model.patch_length=32 model.stride=16` had to be repeated on EVERY command
# of the arm - train, finetune, eval, context sweep. Forgetting it at finetune
# raises a RuntimeError (loud, recoverable); forgetting it at EVAL only warns
# "re-initialising patching.*" and outputs silently wrong numbers, produced by
# a reinitialized patching layer under a trained encoder. A named config
# removes the error class.
#
# The question this arm settles
# --------------------------------
# 63 tokens at ctx 1024 instead of 127: ~4x less attention. The
# patch16/patch32 comparison was never clean (2nd vs 3rd batch also differed
# by the whole P1 bundle and by ftall); here the two arms differ ONLY by the
# patch. Real stake: if patch32 matches patch16, LOTSA-scale training costs
# 4x less - worth knowing before paying for G5.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_tiny_geo_p32"
  patch_length: 32
  stride: 16

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "ctx1024"
    - "patch32"
