# @package _global_
#
# Patch 32/16 arm of the geometry round. Identical to tiny_geo except patching.
#
#   python scripts/train.py    --config-name tiny_geo_p32 wandb.run_name=geo-p32
#   python scripts/train.py    --config-name tiny_geo_p32 training.mode=finetune \
#       +training.pretrained_encoder_path=checkpoints/timejepa_tiny_geo_p32/pretrain_True/<ckpt>
#   python scripts/evaluate.py --config-name tiny_geo_p32 \
#       +checkpoint_path=checkpoints/timejepa_tiny_geo_p32/pretrain_False/<ckpt>
#
# Why a config rather than two overrides: `model.patch_length=32
# model.stride=16` had to be repeated on every command of the arm.
# Forgetting it at finetune raises a RuntimeError; forgetting it at eval
# only warns "re-initialising patching.*" and outputs wrong numbers.
#
# The question: 63 tokens at ctx 1024 instead of 127, ~4x less attention.
# Here the two arms differ only by the patch. If patch32 matches patch16,
# LOTSA-scale training costs 4x less.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_tiny_geo_p32"
  patch_length: 32
  stride: 16

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "ctx1024"
    - "patch32"
