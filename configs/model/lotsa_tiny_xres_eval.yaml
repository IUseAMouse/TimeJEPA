# @package _global_
# Eval of the xres checkpoints: carries cross_resolution (the FiLM is a
# predictor weight, and without the flag loading.py refuses) and
# robust_scale (marker, see lotsa_tiny_mix_eval).
defaults:
  - lotsa_tiny_eval
  - _self_

model:
  cross_resolution: true
  robust_scale: true
