# @package _global_
#
# Corpus v3 recipe run.
#
#   python scripts/train.py --config-name lotsa_tiny_v3 wandb.run_name=v3
#   # then: lotsa_tiny_v3_zeroshot (1-epoch finetune) and lotsa_tiny_v3_eval
#
# Prerequisite: the corpus data/processed/lotsa_v3 must exist. Assembly:
#   1. python scripts/generate_synthetic.py --set v3 --out data/processed/synthetic_v3 \
#          --chunks-per-family <sized by the audit: aim for ~40-50% synthetic batch share>
#   2. python scripts/prepare_lotsa.py --out data/processed/lotsa_short \
#          --subsets m1_monthly m1_quarterly m1_yearly monash_m3_monthly \
#          monash_m3_other monash_m3_quarterly monash_m3_yearly tourism_monthly \
#          tourism_quarterly tourism_yearly nn5_daily_with_missing nn5_weekly \
#          --min-length 384 --chunk-length 1280 --pad-to 1280
#   3. python scripts/prepare_lotsa.py --out data/processed/lotsa_solar \
#          --subsets solar_power
#   4. python scripts/decimate_corpus.py --src data/processed/lotsa_full \
#          --dst data/processed/decimated --factors 2,3 --families <dense 5T>
#   5. mkdir data/processed/lotsa_v3 && ln -s the .npy from lotsa_xres +
#      synthetic_v3 + lotsa_short + lotsa_solar + decimated
#   6. python scripts/audit_batch_schedule.py --config-name lotsa_tiny_v3
#      -> adjust volumes until the target composition.
#
# The bundle vs lotsa_tiny_mix:
#   * synthetic ~40-50% of the batch: 3 v1 families + ops_bursty + intermittent;
#   * real short series pad-to-1280;
#   * real solar_power + 5T->10T/15T decimation;
#   * TiRex-style augmentations (the biggest line of their ablation, +0.019);
#   * sampler rationing (stable composition over the epoch, so the final
#     annealing happens on a constant composition).
# Outside the bundle (one variable each, vs this control): xres, h512/h768,
# esjepa-v2, long-context curriculum.
defaults:
  - lotsa_tiny_mix
  - _self_

model:
  name: "timejepa_lotsa_tiny_v3"

checkpoint:
  # Keep every pretrain checkpoint: a val plateau freezes the top-3 mid-run,
  # and judge-checkpoint selection is its own axis, distinct from val and
  # from GIFT. ~40 ckpts x 16 MB.
  save_top_k: -1

data:
  data_dir: "data/processed/lotsa_v3"
  ration_oversample: true

augmentations:
  pretrain:
    # TiRex-style (v3), see augmentations.py; the rest inherits from tiny.yaml.
    amplitude_mod_enabled: true
    p_amplitude_mod: 0.5
    censor_enabled: true
    p_censor: 0.5
    spike_enabled: true
    p_spike: 0.05

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "pretrain", "v3", "robust-scale"]
