# @package _global_
#
# CORPUS V3 — le RUN-RECETTE de la roadmap S2 (bundle assumé, béni par
# l'utilisateur le 2026-08-24 ; PLAN §0bis, carte E19).
#
#   python scripts/train.py --config-name lotsa_tiny_v3 wandb.run_name=v3
#   # puis : lotsa_tiny_v3_zeroshot (finetune 1 ép.) et lotsa_tiny_v3_eval
#
# ⚠️ PRÉREQUIS : le corpus data/processed/lotsa_v3 doit exister — recette
# d'assemblage (roadmap S2.4, à exécuter sur le pod, AVEC audit) :
#   1. python scripts/generate_synthetic.py --set v3 --out data/processed/synthetic_v3 \
#          --chunks-per-family <dimensionné par l'audit — principe « le batch
#          cible d'abord » : viser ~40-50 % de part de batch synthétique>
#   2. python scripts/prepare_lotsa.py --out data/processed/lotsa_short \
#          --subsets m1_monthly m1_quarterly m1_yearly monash_m3_monthly \
#          monash_m3_other monash_m3_quarterly monash_m3_yearly tourism_monthly \
#          tourism_quarterly tourism_yearly nn5_daily_with_missing nn5_weekly \
#          --min-length 384 --chunk-length 1280 --pad-to 1280
#   3. python scripts/prepare_lotsa.py --out data/processed/lotsa_solar \
#          --subsets solar_power   # réadmis 2026-08-24, 3 vérifications lotsa.py
#   4. python scripts/decimate_corpus.py --src data/processed/lotsa_full \
#          --dst data/processed/decimated --factors 2,3 --families <denses 5T>
#   5. mkdir data/processed/lotsa_v3 && ln -s des .npy de lotsa_xres +
#      synthetic_v3 + lotsa_short + lotsa_solar + decimated
#   6. python scripts/audit_batch_schedule.py --config-name lotsa_tiny_v3
#      → ajuster les volumes jusqu'à la composition cible, CONSIGNER l'audit.
#
# BUNDLE DÉCLARÉ (chaque item au registre, prédictions P-v3.1..4 gravées E19) :
#   * synthétique ~40-50 % du batch : 3 familles v1 + ops_bursty (bizitobs —
#     P-v3.1 : 10S geomean 1.387 -> <1.0) + intermittent (car_parts) ;
#   * séries courtes réelles pad-to-1280 (P-v3.2 : bloc A/Q/M/W −10 %) ;
#   * solar_power réel + décimation 5T->10T/15T (P-v3.3 : electricity/15T/long
#     1.206 -> <1.0) ;
#   * augmentations TiRex-style (le plus gros poste de LEUR ablation, +0.019) ;
#   * rationnement G10.2 du sampler (composition stable sur l'époque — le
#     verdict finetune du 2026-08-24 le laisse neutre au finetune, mais
#     l'argument PRETRAIN — recuit final sur composition constante — tient) ;
#   * P-v3.4 : agrégat ≤ 0.59 AVANT couches d'inférence (flip = ~−2.4 % en plus).
# Hors bundle (une variable chacun, vs CE contrôle) : xres, h512/h768,
# esjepa-v2, curriculum long-contexte.
defaults:
  - lotsa_tiny_mix
  - _self_

model:
  name: "timejepa_lotsa_tiny_v3"

checkpoint:
  # Tout garder AU PRETRAIN aussi (2026-08-26) : une val plateau gèle le
  # top-3 à mi-run et prive la série probe-juge des checkpoints tardifs —
  # or la sélection du checkpoint-juge est un axe propre (E20c), distinct de
  # la val et de GIFT. ~40 ckpts × 16 Mo, coût nul.
  save_top_k: -1

data:
  data_dir: "data/processed/lotsa_v3"
  ration_oversample: true

augmentations:
  pretrain:
    # TiRex-style (v3) — voir augmentations.py ; le reste hérite de tiny.yaml.
    amplitude_mod_enabled: true
    p_amplitude_mod: 0.5
    censor_enabled: true
    p_censor: 0.5
    spike_enabled: true
    p_spike: 0.05

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "pretrain", "v3", "robust-scale"]
