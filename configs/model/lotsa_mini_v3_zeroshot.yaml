# @package _global_
# Zero-shot finetune of mini-v3 (1 cosine epoch, selection by GIFT eval, all
# checkpoints kept).
#
#   python scripts/train.py --config-name lotsa_mini_v3_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_mini_v3/pretrain_True/<latest named ckpt>"'
#   # Point to the latest named checkpoint, never last.ckpt (Lightning 2.6.5
#   # writes a stale last.ckpt).
#
# Rationing and augmentations inherited from lotsa_mini_v3 (same rules as the
# tiny-v3 pair: TiRex at pretrain only, rationing on both sides). The scale
# comparison is read on checkpoints paired by % of epoch, not only at the best.
defaults:
  - lotsa_mini_v3
  - _self_

model:
  name: "timejepa_lotsa_mini_v3_zs"

training:
  mode: "finetune"
  finetune_mode: "full_finetune"
  max_epochs: 1

checkpoint:
  save_top_k: -1

data:
  datasets_finetune: null

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "v3", "robust-scale"]
