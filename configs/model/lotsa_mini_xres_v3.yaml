# @package _global_
# Cross-resolution (xres) pretrain at mini scale. Motive: the RateIN oracle
# residual is 2.14 CRPS points (0.5469 detector vs 0.5255 ceiling), stable
# across scales, and passive exposure to decimation (the aug arm) did not
# close it; explicit rate conditioning is the remaining candidate. Mirrors
# lotsa_tiny_xres_v3 (see its header); one-variable comparison against the
# lotsa_mini_v3 control pretrain.
#
#   python scripts/train.py --config-name lotsa_mini_xres_v3 wandb.run_name=xres-mini
#   # then: lotsa_mini_xres_v3_zeroshot and lotsa_mini_xres_v3_eval
defaults:
  - lotsa_mini_v3
  - _self_

model:
  name: "timejepa_lotsa_mini_xres_v3"
  cross_resolution: true

training:
  # Standalone targets are required with xres: two grids cannot share one
  # normalization window (hard guard in the module).
  contextualized_targets: false

data:
  multi_resolution_factors: [1, 2, 4]
  p_multi_resolution: 0.3

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "pretrain", "v3", "xres", "robust-scale"]
