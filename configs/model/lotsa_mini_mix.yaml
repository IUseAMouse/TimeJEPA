# @package _global_
#
# G7.4 - PRETRAIN of the MINI (~5.1M) on the MIX RECIPE (mixed v2 corpus +
# arcsinh + standalone targets), decision 2026-08-23 after E18i.
#
#   python scripts/train.py --config-name lotsa_mini_mix wandb.run_name=mini-mix
#   # then: lotsa_mini_mix_zeroshot (1-epoch finetune) and lotsa_mini_mix_eval
#
# THE targeted comparison: mini-mix vs tiny-mix, ONE variable - capacity.
# Everything else is copied from lotsa_tiny_mix unchanged: corpus
# (data/processed/lotsa_xres, v2 regenerated 20000 chunks/family),
# robust_scale, LR 3e-4 (WARNING: overrides lotsa_mini's 4e-4 - the scale
# duel demands the SAME LR as tiny-mix; if mini preferred another LR, that
# would be one more variable), standalone targets (C1), 2-epoch budget,
# validation 0.05.
# The duel's falsifiable predictions are written in the PLAN (G7.4,
# 2026-08-19): saturation => higher rank/variance plateau + wider tiny->mini
# GIFT gap.
#
# Budget: max_epochs 2 like tiny-mix (cap, manual cut possible). E18c notes
# that 1 annealed epoch "may be enough" - but deviating here would add a
# bundle item to the scale duel; we pay the 2nd epoch for purity.
defaults:
  - lotsa_mini
  - _self_

model:
  name: "timejepa_lotsa_mini_mix"
  robust_scale: true

training:
  # Identical to lotsa_tiny_mix (see its header for the LR reasoning) -
  # NOT lotsa_mini's 4e-4: one variable, capacity.
  optimizer:
    learning_rate: 3.0e-4
  max_epochs: 2
  # C1 (audit 2026-08-20): standalone targets, like tiny-mix and xres.
  contextualized_targets: false

trainer:
  val_check_interval: 0.05

early_stopping:
  # Disabled, same reasoning as lotsa_tiny_mix / lotsa_mini_full: the model's
  # value is at the end of annealing, not at the val_loss dip (E12).
  enabled: false

data:
  data_dir: "data/processed/lotsa_xres"

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "pretrain", "mix", "robust-scale"]
