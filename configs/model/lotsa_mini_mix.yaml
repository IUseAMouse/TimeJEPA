# @package _global_
#
# Pretrain of the mini (~5.1M) on the mix recipe (mixed v2 corpus +
# arcsinh + standalone targets).
#
#   python scripts/train.py --config-name lotsa_mini_mix wandb.run_name=mini-mix
#   # then: lotsa_mini_mix_zeroshot (1-epoch finetune) and lotsa_mini_mix_eval
#
# Comparison mini-mix vs tiny-mix with one variable, capacity. Everything else
# is copied from lotsa_tiny_mix unchanged: corpus (data/processed/lotsa_xres,
# v2 regenerated 20000 chunks/family), robust_scale, LR 3e-4 (overrides
# lotsa_mini's 4e-4 so both scales share the same LR), standalone targets,
# 2-epoch budget, validation 0.05.
defaults:
  - lotsa_mini
  - _self_

model:
  name: "timejepa_lotsa_mini_mix"
  robust_scale: true

training:
  # Identical to lotsa_tiny_mix (see its header for the LR reasoning),
  # overriding lotsa_mini's 4e-4.
  optimizer:
    learning_rate: 3.0e-4
  max_epochs: 2
  # Standalone targets, like tiny-mix and xres.
  contextualized_targets: false

trainer:
  val_check_interval: 0.05

early_stopping:
  # Disabled, same reasoning as lotsa_tiny_mix / lotsa_mini_full: the model's
  # value is at the end of annealing, not at the val_loss dip.
  enabled: false

data:
  data_dir: "data/processed/lotsa_xres"

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "pretrain", "mix", "robust-scale"]
