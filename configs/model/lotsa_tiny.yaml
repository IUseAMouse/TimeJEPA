# @package _global_
#
# G5 — PRETRAIN SUR LOTSA. Géométrie identique à tiny_geo, corpus remplacé.
#
#   # 1. conversion (une fois) — relire la liste des EXCLUS qu'il imprime
#   python scripts/prepare_lotsa.py --list
#   python scripts/prepare_lotsa.py --out data/processed/lotsa
#
#   # 2. pretrain
#   python scripts/train.py --config-name lotsa_tiny wandb.run_name=lotsa-pretrain
#
#   # 3. finetune — sur le corpus Monash habituel, PAS sur LOTSA
#   python scripts/train.py --config-name lotsa_tiny_finetune \
#       +training.pretrained_encoder_path=checkpoints/timejepa_lotsa_tiny/pretrain_True/<ckpt>
#
# Pourquoi LOTSA, et pourquoi maintenant
# --------------------------------------
# E12 a établi que le pretraining améliore le TRANSFERT hors du domaine d'aval
# (−8,7 % de MASE), pas l'ajustement à ce domaine — où le scratch fait mieux.
# LOTSA est donc l'expérience qui prolonge directement ce résultat, avec une
# prédiction falsifiable : si le gain est bien un gain de transfert, un corpus
# ~1000x plus grand ET réellement diversifié doit le creuser. S'il ne bouge pas,
# le plafond n'est pas dans les données.
#
# E10 donne la seconde raison : le corpus actuel n'est diversifié qu'en apparence
# — wind-farms-minutely et london-smart-meters pèsent 48,7 % du batch, tous deux
# à très haute fréquence. LOTSA couvre toutes les fréquences, et la conversion
# plafonne chaque sous-ensemble pour ne pas reproduire ce déséquilibre.
#
# Ce qui change par rapport à tiny_geo, et rien d'autre
# ----------------------------------------------------
# 1. `data.data_dir` pointe sur le corpus converti.
# 2. `data.datasets: null` => tous les `.npy` du répertoire (dataset_pattern).
# 3. `data.use_mmap: true` => fichiers lus sans passer par la RAM. Indispensable :
#    les fichiers font des Go. Ce drapeau est ABSENT de toutes les autres configs,
#    donc leur comportement est inchangé au bit près.
# 4. `datasets_finetune` reste le corpus Monash : on pré-entraîne sur LOTSA et on
#    finetune sur les données du domaine, comme Moirai/Chronos. Voir
#    lotsa_tiny_finetune.
# 5. Multi-résolution désactivée : LOTSA couvre déjà nativement les fréquences,
#    la décimation synthétique ferait double emploi et coûte des fenêtres.
#
# ⚠️ Avant de lancer — contamination de l'évaluation
# --------------------------------------------------
# LOTSA CONTIENT ETT, electricity, traffic, weather. `prepare_lotsa.py` les
# exclut par sous-chaîne et imprime la liste : **la relire**. Un pretrain sur un
# benchmark d'évaluation invaliderait tous les chiffres du projet.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_lotsa_tiny"

training:
  # ⚠️ LE RÉGLAGE LE PLUS IMPORTANT DE CETTE CONFIG, et le moins évident.
  #
  # Le scheduler est un cosinus calibré sur `max_epochs`. Le défaut hérité de
  # tiny.yaml est 40 — soit, à 6 h l'époque sur ce corpus, DIX JOURS. Le premier
  # run LOTSA en a fait 3, donc le LR n'a décru que de 0,000749 à 0,000740 en
  # 400 000 pas : le modèle a tourné à LR maximal du début à la fin.
  #
  # Un modèle à LR constant maximal ne converge pas, il oscille. Mesuré sur ce
  # run : val_loss rebondissant entre 0,345 et 0,445 sans tendance, alors que
  # train_loss_epoch descendait proprement (0,47 → 0,395) — et un « meilleur
  # checkpoint » qui tombait donc sur un creux de bruit, systématiquement vers le
  # milieu de l'époque 1.
  #
  # `max_epochs` doit refléter le BUDGET RÉEL. À 5, le cosinus décroît jusqu'à ~0
  # et la fin de run devient une vraie convergence.
  #
  # Corollaire pour la sélection de checkpoint : avec un recuit correct, prendre
  # le DERNIER. Sans recuit, ni le dernier ni le meilleur val_loss ne sont
  # légitimes — il faut en évaluer plusieurs (voir E13 du registre).
  max_epochs: 5

data:
  data_dir: "data/processed/lotsa"

  # Mesuré sur 3x RTX 3090 : à batch 256, seulement 3 Go de VRAM (11 %) et 53-74 %
  # d'occupation GPU — le goulot est le chargement, pas le calcul. Un batch plus
  # gros amortit le coût par itération et remplit les cartes, et 512 retombe
  # exactement sur le batch effectif 1536 des runs de référence (3 GPU).
  # À revalider par un run court : ~6 Go attendus, il reste de la marge.
  batch_size: 512

  # 3 GPU x 8 = 24 workers. À 11 % de VRAM et 60 % d'occupation, c'est le nombre
  # de workers qui limite, pas la mémoire. Garder persistent_workers à false
  # (défaut) : c'est ce qui avait fait tuer un run par l'OOM killer (B19).
  num_workers: 8
  # null => prend tous les .npy du répertoire, donc pas de liste à maintenir
  # au fil des versions de LOTSA.
  datasets: null
  dataset_pattern: "*.npy"
  use_mmap: true

  # Le plafond par sous-ensemble est appliqué à la CONVERSION
  # (--max-chunks-per-subset) ; la température reste le second garde-fou.
  sampling_temperature: 0.5

  # 6.0 était le défaut de tiny.yaml, calibré pour 24 datasets Monash. Sur 112
  # sous-ensembles LOTSA, le log montre des datasets de 648 échantillons repassés
  # SIX fois par époque — 18 passes en 3 époques. E13b a mesuré du surapprentissage
  # net (train qui descend, val qui monte, à partir d'environ une époque) ; ce
  # sur-échantillonnage en est un contributeur direct et gratuit à supprimer.
  max_oversample_ratio: 3.0

  # Le stride doit suivre la longueur des morceaux, qui n'est PAS 8192.
  # La conversion choisit la longueur par sous-ensemble (médiane des séries,
  # plafonnée) et sort surtout du ~2048, parce qu'un chunk fixe à 8192 jetait des
  # sous-ensembles entiers — alibaba y perdait 108 852 de ses 116 818 séries.
  #
  # Fenêtres par morceau = (longueur − 1280) / stride :
  #   morceau 2048, stride 64  ->  12   ← l'époque serait 5x plus PETITE que Monash
  #   morceau 2048, stride  8  ->  96   ← comparable aux 50 M de fenêtres Monash
  #
  # 8 est donc le bon réglage ici, et le raisonnement « corpus énorme donc stride
  # large » ne tient plus : les plafonds par famille prélèvent ~12 % de LOTSA,
  # soit ~10x Monash en observations, pas 1000x.
  stride: 8

  # Multi-résolution off : LOTSA apporte les fréquences en nature.
  multi_resolution_factors: [1]
  p_multi_resolution: 0.0

trainer:
  # Batch effectif = batch_size x accumulation x nombre de GPU.
  #   512 x 1 x 3 GPU = 1536  ← exactement le régime des runs de référence
  #   512 x 1 x 4 GPU = 2048
  # tiny_geo utilisait accumulation 6 parce qu'il tournait sur 1 ou 2 cartes ;
  # hériter cette valeur donnait 6144 ici, un régime de LR sans rapport avec
  # aucun run précédent, et forçait un override sur chaque commande.
  # ⚠️ Sur 1 GPU, remettre accumulate_grad_batches=3.
  accumulate_grad_batches: 1

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
