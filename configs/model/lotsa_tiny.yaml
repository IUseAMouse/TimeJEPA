# @package _global_
#
# Pretrain on LOTSA. Geometry identical to tiny_geo, corpus swapped.
#
#   # 1. conversion (once); re-read the excluded list it prints
#   python scripts/prepare_lotsa.py --list
#   python scripts/prepare_lotsa.py --out data/processed/lotsa
#
#   # 2. pretrain
#   python scripts/train.py --config-name lotsa_tiny wandb.run_name=lotsa-pretrain
#
#   # 3. finetune, on the usual Monash corpus, not on LOTSA
#   python scripts/train.py --config-name lotsa_tiny_finetune \
#       +training.pretrained_encoder_path=checkpoints/timejepa_lotsa_tiny/pretrain_True/<ckpt>
#
# Why LOTSA: pretraining was found to improve transfer outside the downstream
# domain rather than the fit to it, and the Monash corpus is only diverse on
# the surface (wind-farms-minutely and london-smart-meters weigh 48.7% of the
# batch). LOTSA covers all frequencies, and the conversion caps each subset
# to avoid reproducing that imbalance.
#
# What changes vs tiny_geo, and nothing else:
# 1. `data.data_dir` points to the converted corpus.
# 2. `data.datasets: null` => all `.npy` in the directory (dataset_pattern).
# 3. `data.use_mmap: true` => files read without going through RAM (the files
#    are GB-sized). The flag is absent from every other config.
# 4. `datasets_finetune` stays the Monash corpus: pretrain on LOTSA, finetune
#    on in-domain data, like Moirai/Chronos. See lotsa_tiny_finetune.
# 5. Multi-resolution disabled: LOTSA already covers frequencies natively.
#
# Evaluation contamination: LOTSA contains ETT, electricity, traffic, weather.
# `prepare_lotsa.py` excludes them by substring and prints the list; re-read it.
defaults:
  - tiny_geo
  - _self_

model:
  name: "timejepa_lotsa_tiny"

training:
  # The cosine scheduler is calibrated on `max_epochs`, so it must reflect the
  # real budget. The inherited default of 40 (about 6 h per epoch here) left a
  # 3-epoch run at maximal LR throughout, with val_loss oscillating between
  # 0.345 and 0.445 and no convergence. At 5 the cosine decays to ~0, and the
  # last checkpoint is the one to take.
  max_epochs: 5

data:
  data_dir: "data/processed/lotsa"

  # On 3x RTX 3090, batch 256 used only 3 GB of VRAM at 53-74% GPU occupancy:
  # the bottleneck is loading. 512 fills the cards and gives the effective
  # batch 1536 of the reference runs (3 GPUs).
  batch_size: 512

  # 3 GPUs x 8 = 24 workers. Keep persistent_workers at false (default):
  # persistent workers got a run killed by the OOM killer.
  num_workers: 8
  # null => take every .npy in the directory, so no list to maintain across
  # LOTSA versions.
  datasets: null
  dataset_pattern: "*.npy"
  use_mmap: true

  # The per-subset cap is applied at conversion time (--max-chunks-per-subset);
  # temperature remains the second guardrail.
  sampling_temperature: 0.5

  # 6.0 was the tiny.yaml default, calibrated for 24 Monash datasets. On 112
  # LOTSA subsets it replayed 648-sample datasets six times per epoch, a direct
  # contributor to the overfitting observed after about one epoch.
  max_oversample_ratio: 3.0

  # Stride must follow chunk length. The conversion picks the length per
  # subset (median of the series, capped) and mostly outputs ~2048, because a
  # fixed 8192 chunk dropped whole subsets (alibaba lost 108,852 of its
  # 116,818 series). Windows per chunk = (length - 1280) / stride: at 2048,
  # stride 64 gives 12 and stride 8 gives 96, comparable to Monash's 50M
  # windows. The per-family caps sample ~12% of LOTSA, about 10x Monash.
  stride: 8

  # Multi-resolution off: LOTSA provides the frequencies natively.
  multi_resolution_factors: [1]
  p_multi_resolution: 0.0

trainer:
  # Effective batch = batch_size x accumulation x GPU count:
  # 512 x 1 x 3 GPUs = 1536, the regime of the reference runs. tiny_geo used
  # accumulation 6 because it ran on 1 or 2 cards. On 1 GPU, set
  # accumulate_grad_batches=3.
  accumulate_grad_batches: 1

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
