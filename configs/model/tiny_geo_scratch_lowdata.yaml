# @package _global_
#
# G4.6 — TRANSFERT VERS DES DONNÉES INÉDITES, arm SCRATCH (le contrôle).
# Config jumelle : tiny_geo_lowdata (identique, AVEC poids pré-entraînés).
#
#   python scripts/train.py --config-name tiny_geo_scratch_lowdata \
#       wandb.run_name=lowdata-scratch
#
# ⚠️ AUCUN `+training.pretrained_encoder_path` — c'est tout l'objet de la config.
# Sans ce flag, l'encodeur part d'une initialisation aléatoire.
#
# Cette config hérite de tiny_geo_lowdata et n'en change QUE le nom du modèle.
# Tout le reste — architecture, géométrie, epochs, mode de finetune, décodeur,
# datasets, seed — est donc identique par construction, et le restera si l'un des
# deux est modifié. C'est la garantie que l'expérience porte sur une seule
# variable : la présence ou non de poids pré-entraînés.
#
# Note sur l'asymétrie du corpus : m4-hourly et nn5-daily n'ont jamais été vus
# par le PRETRAIN (écartés par le filtre de longueur à fenêtre 1280). Pour cet
# arm-ci la question ne se pose pas — il n'a rien vu du tout.
#
# Voir tiny_geo_lowdata pour le protocole complet et le raisonnement.
defaults:
  - tiny_geo_lowdata
  - _self_

model:
  name: "timejepa_geo_scratch_lowdata"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "lowdata"
    - "held-out"
    - "scratch"
