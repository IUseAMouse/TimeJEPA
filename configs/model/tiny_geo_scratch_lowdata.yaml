# @package _global_
#
# Transfer to unseen data, scratch arm (the control).
# Twin config: tiny_geo_lowdata (identical, with pretrained weights).
#
#   python scripts/train.py --config-name tiny_geo_scratch_lowdata \
#       wandb.run_name=lowdata-scratch
#
# No `+training.pretrained_encoder_path`, by design: the encoder starts from
# random init.
#
# This config inherits from tiny_geo_lowdata and only changes the model
# name, so architecture, geometry, epochs, finetune mode, decoder, datasets
# and seed stay identical by construction. The experiment carries a single
# variable: the presence or absence of pretrained weights.
#
# See tiny_geo_lowdata for the full protocol and reasoning.
defaults:
  - tiny_geo_lowdata
  - _self_

model:
  name: "timejepa_geo_scratch_lowdata"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "geo-round"
    - "lowdata"
    - "held-out"
    - "scratch"
