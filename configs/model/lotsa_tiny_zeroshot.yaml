# @package _global_
#
# Finetune on LOTSA, for a zero-shot evaluation. The main protocol.
#
#   python scripts/train.py --config-name lotsa_tiny_zeroshot \
#       '+training.pretrained_encoder_path="checkpoints/timejepa_lotsa_tiny/pretrain_True/<ckpt>"' \
#       wandb.run_name=lotsa-zeroshot
#
#   # evaluation: Monash and Nixtla were never seen, not at pretrain nor here
#   python scripts/evaluate.py --config-name tiny_geo \
#       +checkpoint_path=checkpoints/timejepa_lotsa_tiny_zs/pretrain_False/<ckpt>
#
# Why finetune on LOTSA and not on Monash: after the JEPA pretrain the
# decoder is still random, so a finetune is required. Finetuning on Monash
# would reopen the contamination with supervised targets on the evaluation's
# series: `electricity-hourly` is the Nixtla benchmark `electricity`
# (5260/26304 = the last 20%), `traffic-hourly` is `traffic` (3508/17544),
# and the sequential split covers those series over their whole span.
# Training both stages on LOTSA makes training and evaluation corpora
# disjoint by construction, verifiable in the conversion log, and produces
# numbers comparable to Chronos / Moirai / TimesFM / Toto.
#
# Absolute numbers drop versus the Monash runs, sharply on traffic and
# electricity: that is the disappearance of a contamination artifact plus
# the real cost of giving up domain adaptation. The alternative arm
# `lotsa_tiny_finetune` adapts to the Monash domain: better absolute
# numbers, but contaminated on electricity and traffic, useful only as an
# upper bound.
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_tiny_zs"

training:
  mode: "finetune"
  # Same mode as the earlier finetune arms, so the numbers compare.
  finetune_mode: "full_finetune"

data:
  # null => glob of the LOTSA directory, exactly like the pretrain, so the
  # decoder only sees LOTSA.
  datasets_finetune: null

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "zeroshot"
