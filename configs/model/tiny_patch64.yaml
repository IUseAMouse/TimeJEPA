# @package _global_
#
# Experiment: patch 64 / stride 32 (baseline tiny is 16 / 8).
#
# On ETTm1 (cycle 96) this puts the seasonal cycle at 96/32 = 3 patch
# positions, the regime where electricity, traffic and weather all win
# (+18% to +30% skill). If ETTm1 skill turns positive here, the patch-size
# theory is confirmed and the remedy is multi-scale patching. If it does not
# move, the bottleneck is elsewhere (see tiny_deep_predictor.yaml).
#
# Caveat: at this patch size the context holds only 15 tokens and the
# prediction only 3, so a degradation could be the token count rather than
# the ratio. tiny_patch32.yaml gives the third point (12 / 6 / 3 positions
# per cycle), and a trend separates "ratio helps" from "fewer tokens hurt".
#
# Geometry (verified):
#   ctx 512 -> 15 patches      pred 128 -> 3 target patches
#   ctx 256 ->  7 patches      H=64     -> 1 target patch
#   ctx 128 ->  3 patches (too few; context randomization starts at 256)
#   H=32    ->  0 patches (would crash; horizon randomization starts at 96)
defaults:
  - tiny
  - _self_

model:
  name: "timejepa_tiny_patch64"
  patch_length: 64
  stride: 32

training:
  # Both bounds raised: the coarse patching makes short contexts and short
  # horizons degenerate (see the geometry note above).
  context_lengths: [256, 320, 384, 448, 512]
  horizon_lengths: [96, 128]

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "patch64"
