# @package _global_
#
# LOTSA pretrain, base scale (36.4M parameters, the order of magnitude of TiRex).
#
#   make train CONFIG=lotsa_base ARGS="trainer.accumulate_grad_batches=6 wandb.run_name=lotsa-base"
#
# Inherits from `lotsa_tiny` for everything that is not model size (corpus,
# memmap, exclusions, stride, 1024/256 geometry, sigreg loss, quantile
# decoder), so the only variable across scales is capacity.
#
# The dimensions are written explicitly rather than inherited from `base.yaml`,
# whose `data` block would overwrite the LOTSA corpus; a test verifies they
# stay identical to the reference.
#
# Batch 128 x accumulation 4 x 3 GPUs = 1536 effective batch, a starting point
# for 24 GB at context 1024. +trainer.max_steps=5000 bounds a smoke test.
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_base"
  encoder:
    d_model: 384
    n_heads: 8
    n_layers: 8
    d_ff: 1536
  predictor:
    d_model: 384
    n_heads: 8
    n_layers: 4
    d_ff: 1536
  decoder:
    d_model: 384
    hidden_dim: 768
    n_layers: 4

training:
  optimizer:
    learning_rate: 0.0005

data:
  batch_size: 128

trainer:
  accumulate_grad_batches: 4

wandb:
  tags:
    - "base"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
