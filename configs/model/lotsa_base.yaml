# @package _global_
#
# G5 - LOTSA PRETRAIN, base scale (36.4M parameters).
#
#   make train CONFIG=lotsa_base ARGS="trainer.accumulate_grad_batches=6 wandb.run_name=lotsa-base"
#
# 36M parameters, the order of magnitude of TiRex (~35M) which holds the top
# of the GIFT-Eval leaderboard. This is the tier where the SOTA comparison
# becomes head-on rather than categorical - and where compute cost stops
# being anecdotal: ~7x tiny in parameters, and attention dominates at 127
# patches.
#
# Inherits from `lotsa_tiny` for EVERYTHING that is not model size: converted
# corpus, memmap, exclusions, stride, 1024/256 geometry, sigreg loss,
# quantile decoder. The only variable is capacity - that is what makes the
# cross-scale comparison interpretable.
#
# The dimensions are written EXPLICITLY rather than inherited from
# `base.yaml`: that file also carries its own `data` block, which would
# overwrite the LOTSA corpus. A test verifies they stay identical to the
# reference.
#
# Batch and accumulation
# ---------------------
# batch 128 x accumulation 4 x 3 GPUs = 1536 effective batch, in the order of
# magnitude of the reference runs' 1536. TO VALIDATE with a short run: these
# values are a starting point for 24 GB at context 1024, not a measurement.
#   +trainer.max_steps=5000 to bound the smoke test.
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_base"
  encoder:
    d_model: 384
    n_heads: 8
    n_layers: 8
    d_ff: 1536
  predictor:
    d_model: 384
    n_heads: 8
    n_layers: 4
    d_ff: 1536
  decoder:
    d_model: 384
    hidden_dim: 768
    n_layers: 4

training:
  optimizer:
    learning_rate: 0.0005

data:
  batch_size: 128

trainer:
  accumulate_grad_batches: 4

wandb:
  tags:
    - "base"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
