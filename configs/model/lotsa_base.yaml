# @package _global_
#
# G5 — PRETRAIN LOTSA, échelle base (36,4 M paramètres).
#
#   make train CONFIG=lotsa_base ARGS="trainer.accumulate_grad_batches=6 wandb.run_name=lotsa-base"
#
# 36 M paramètres, l'ordre de grandeur de TiRex (~35 M) qui tient le haut
# du classement GIFT-Eval. C'est le palier où la comparaison au SOTA
# devient frontale plutôt que catégorielle — et où le coût de calcul
# cesse d'être anecdotique : ~7x tiny en paramètres, et l'attention
# domine à 127 patchs.
#
# Hérite de `lotsa_tiny` pour TOUT ce qui n'est pas la taille du modèle : corpus
# converti, memmap, exclusions, stride, géométrie 1024/256, loss sigreg, décodeur
# quantile. La seule variable est la capacité — c'est ce qui rend la comparaison
# entre échelles interprétable.
#
# Les dimensions sont écrites EXPLICITEMENT plutôt qu'héritées de `base.yaml` :
# celui-ci porte aussi son propre bloc `data`, qui écraserait le corpus LOTSA.
# Un test vérifie qu'elles restent identiques à la référence.
#
# Batch et accumulation
# ---------------------
# batch 128 x accumulation 4 x 3 GPU = 1536 de batch effectif, dans l'ordre
# de grandeur des 1536 des runs de référence. À VALIDER par un run court : ces
# valeurs sont un point de départ pour 24 Go à contexte 1024, pas une mesure.
#   +trainer.max_steps=5000 pour borner le smoke test.
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_base"
  encoder:
    d_model: 384
    n_heads: 8
    n_layers: 8
    d_ff: 1536
  predictor:
    d_model: 384
    n_heads: 8
    n_layers: 4
    d_ff: 1536
  decoder:
    d_model: 384
    hidden_dim: 768
    n_layers: 4

training:
  optimizer:
    learning_rate: 0.0005

data:
  batch_size: 128

trainer:
  accumulate_grad_batches: 4

wandb:
  tags:
    - "base"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
