# @package _global_
# Eval of the mini-v3 checkpoints (GIFT / Nixtla).
#
#   python scripts/evaluate_gift.py --config-name lotsa_mini_v3_eval \
#       '+checkpoint_path="checkpoints/timejepa_lotsa_mini_v3_zs/pretrain_False/<ckpt>"' +tta_flip=true
#   # official procedure: always publish bare AND xflip (E19b).
#
# robust_scale inherited from lotsa_mini_mix_eval (P3.2). Name overridden so
# results land in evaluation/timejepa_lotsa_mini_v3_zs/.
defaults:
  - lotsa_mini_mix_eval
  - _self_

model:
  name: "timejepa_lotsa_mini_v3_zs"

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "eval", "v3", "robust-scale"]
