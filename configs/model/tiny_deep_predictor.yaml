# @package _global_
#
# Experiment: deeper predictor, patching unchanged (16 / 8).
#
# Control for the patch-size experiments. The diagnostic established that
# skill tracks the seasonal period in patch positions; whether the cause is
# the ratio itself or the 2-layer predictor's limited range is untested. If
# the bottleneck is predictor capacity, deepening the predictor should
# recover ETTm1 skill while leaving the patch size alone.
#
# Run it alongside tiny_patch32/64: together they separate two explanations.
#   patch32/64 improves, this does not  -> the ratio is the driver
#   this improves, patch32/64 does not  -> predictor capacity is the driver
#   both improve                        -> both contribute
#   neither improves                    -> the mechanism is something else
#
# Cost: the predictor goes from 2 to 4 layers, roughly +0.4M parameters on a
# 1.6M model, so a gain could be raw capacity rather than depth.
defaults:
  - tiny
  - _self_

model:
  name: "timejepa_tiny_deep_predictor"
  predictor:
    n_layers: 4

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "deep-predictor"
