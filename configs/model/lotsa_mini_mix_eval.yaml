# @package _global_
# Eval of the mini-mix checkpoints (GIFT / Nixtla).
#
#   python scripts/evaluate_gift.py --config-name lotsa_mini_mix_eval \
#       '+checkpoint_path="checkpoints/timejepa_lotsa_mini_mix_zs/pretrain_False/<ckpt>"'
#
# WARNING: robust_scale MUST be carried here (like lotsa_tiny_mix_eval): the
# flag weighs no parameters, only the checkpoint's marker betrays it -
# without it, loading.py refuses (P3.2) instead of outputting silently wrong
# numbers. The name is overridden so results land in
# evaluation/timejepa_lotsa_mini_mix_zs/ (the tiny lineage's cosmetic trap,
# which writes into timejepa_lotsa_tiny_zs/, is not carried over).
defaults:
  - lotsa_mini_eval
  - _self_

model:
  name: "timejepa_lotsa_mini_mix_zs"
  robust_scale: true

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "eval", "mix", "robust-scale"]
