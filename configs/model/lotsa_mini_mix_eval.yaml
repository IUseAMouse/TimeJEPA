# @package _global_
# Eval of the mini-mix checkpoints (GIFT / Nixtla).
#
#   python scripts/evaluate_gift.py --config-name lotsa_mini_mix_eval \
#       '+checkpoint_path="checkpoints/timejepa_lotsa_mini_mix_zs/pretrain_False/<ckpt>"'
#
# robust_scale must be carried here (as in lotsa_tiny_mix_eval): the flag has
# no parameters, only the checkpoint's marker records it, and without it
# loading.py refuses the checkpoint. The name is overridden so results land in
# evaluation/timejepa_lotsa_mini_mix_zs/.
defaults:
  - lotsa_mini_eval
  - _self_

model:
  name: "timejepa_lotsa_mini_mix_zs"
  robust_scale: true

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "zeroshot", "eval", "mix", "robust-scale"]
