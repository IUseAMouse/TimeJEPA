# @package _global_
#
# G7.4 — PRETRAIN du MINI (~3,5 M entraînables) sur la RECETTE V3, décision
# utilisateur 2026-08-31 après la triple convergence (mix 0.5959 / esjepa
# 0.5981 / v3 0.5983 ×flip, plateau v3 entier à 0.597 ± 0.002).
#
#   python scripts/train.py --config-name lotsa_mini_v3 wandb.run_name=mini-v3
#   # puis : lotsa_mini_v3_zeroshot (finetune 1 ép.) et lotsa_mini_v3_eval
#
# LA question que ce run tranche : la capacité est-elle la contrainte liante
# à 1.1M ? UNE variable — la taille (d_model 192, enc 4 / pred 3 couches,
# d_ff 768) contre le contrôle lotsa_tiny_v3. Tout le reste est le bundle v3
# à l'identique : corpus lotsa_v3 (106 familles, 54.0 % synthétique, audit
# consigné), rationnement pretrain+finetune, augmentations TiRex, LR 3e-4
# (PAS le 4e-4 de lotsa_mini — le duel d'échelle exige le même LR), budget
# 2 époques, save_top_k -1 (piège last.ckpt), cibles standalone.
#
# PRÉDICTIONS GRAVÉES (registre 2026-08-31, avant premier step) :
#   * P-mini.1 (succès)  : CRPS ×flip ≤ 0.580 au meilleur checkpoint du
#     finetune ; central 0.570 ± 0.010 ; étirement < 0.555.
#   * P-mini.2 (corps)   : le gain vit dans le CORPS (81 configs hors queue),
#     pas dans la queue — la capacité est un levier diffus, comme le gap.
#   * P-mini.3 (santé)   : plateau de rang effectif PLUS HAUT que tiny-v3
#     (G7.4 : la saturation de tiny doit se voir en creux ici).
#   * P-mini.4 (juge)    : pic-tôt du probe-juge (4e observation ⇒ la loi
#     tient à travers les échelles), rang ≤ 0.21.
#   * ÉCHEC-DIAGNOSTIC   : ×flip > 0.593 ⇒ la capacité N'ÉTAIT PAS le mur,
#     la lecture « triple convergence = plafond capacitaire » est réfutée et
#     le suspect redevient la recette/l'objectif. Sans appel.
#
# ÉCART DÉCLARÉ (hérité de lotsa_mini, mémoire 24 Go) : batch 384×3 GPU
# = 1152 effectif contre 1536 pour tiny — item de bundle assumé, à rappeler
# si le duel se joue à < 1 pt.
defaults:
  - lotsa_mini_mix
  - _self_

model:
  name: "timejepa_lotsa_mini_v3"

checkpoint:
  # Tout garder au pretrain (piège last.ckpt + série probe-juge, cf.
  # lotsa_tiny_v3) : ~40 ckpts × ~45 Mo à cette taille, coût négligeable.
  save_top_k: -1

data:
  data_dir: "data/processed/lotsa_v3"
  ration_oversample: true

augmentations:
  pretrain:
    # TiRex-style, identiques à lotsa_tiny_v3 (le bundle, pas une variable).
    amplitude_mod_enabled: true
    p_amplitude_mod: 0.5
    censor_enabled: true
    p_censor: 0.5
    spike_enabled: true
    p_spike: 0.05

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "pretrain", "v3", "robust-scale"]
