# @package _global_
#
# Pretrain of the mini (~3.5M trainable) on the v3 recipe.
#
#   python scripts/train.py --config-name lotsa_mini_v3 wandb.run_name=mini-v3
#   # then: lotsa_mini_v3_zeroshot (1-epoch finetune) and lotsa_mini_v3_eval
#
# One variable against the lotsa_tiny_v3 control: size (d_model 192, enc 4 /
# pred 3 layers, d_ff 768). Everything else is the v3 bundle unchanged:
# lotsa_v3 corpus (106 families, 54.0% synthetic), rationing at
# pretrain+finetune, TiRex augmentations, LR 3e-4 (not lotsa_mini's 4e-4, so
# both scales share the same LR), 2-epoch budget, save_top_k -1, standalone
# targets.
#
# Known deviation inherited from lotsa_mini (24 GB memory): batch 384 x 3 GPUs
# = 1152 effective vs 1536 for tiny.
defaults:
  - lotsa_mini_mix
  - _self_

model:
  name: "timejepa_lotsa_mini_v3"

checkpoint:
  # Keep every pretrain checkpoint (as in lotsa_tiny_v3): ~40 ckpts x ~45 MB.
  save_top_k: -1

data:
  data_dir: "data/processed/lotsa_v3"
  ration_oversample: true

augmentations:
  pretrain:
    # TiRex-style, identical to lotsa_tiny_v3.
    amplitude_mod_enabled: true
    p_amplitude_mod: 0.5
    censor_enabled: true
    p_censor: 0.5
    spike_enabled: true
    p_spike: 0.05

wandb:
  tags: ["mini", "jepa_tst", "experiment", "lotsa", "pretrain", "v3", "robust-scale"]
