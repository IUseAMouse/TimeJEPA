# @package _global_
#
# Objective ablation: reconstruction vs latent extrapolation.
#
#   # pretrain of the reconstruction arm
#   python scripts/train.py --config-name lotsa_tiny_recon wandb.run_name=recon-pretrain
#
#   # zero-shot finetune, protocol identical to the JEPA arm, distinct output name
#   # (lotsa_tiny_zeroshot would send checkpoints into the JEPA arm's directory:
#   #  same model.name, so same folder. See lotsa_tiny_recon_zeroshot.)
#   python scripts/train.py --config-name lotsa_tiny_recon_zeroshot \
#       +training.pretrained_encoder_path=checkpoints/timejepa_lotsa_tiny_recon/pretrain_True/<ckpt> \
#       wandb.run_name=recon-zeroshot
#
#   # eval
#   python scripts/evaluate.py --config-name lotsa_tiny_eval \
#       +checkpoint_path=checkpoints/timejepa_lotsa_tiny_recon_zs/pretrain_False/<ckpt>
#
# Why: the pretraining results compare against the absence of pretraining,
# not against a competing objective. A reconstruction objective at identical
# budget (what Moirai and Moment do) is a reviewer's default hypothesis.
#
# What changes, one variable:
#   JEPA      : the predictor regresses toward target_encoder(future patches)
#   this arm  : the predictor regresses toward the raw future patches
#
# The task stays past -> future; corpus, geometry, budget, optimizer,
# scheduler, stride and caps are inherited from lotsa_tiny. Moirai-style
# masked reconstruction is not tested because it would change the target
# space and the task shape at once. The objective used here is TimesFM's.
#
# Why Huber and not MSE: RevIN normalizes the target with the context
# statistics, and its scale is sqrt(var + 1e-5). On a near-constant context
# (flat sensor, dead meter, solar at night) that floor is 0.00316, and the
# slightest move in the future window lands at thousands of sigma (measured:
# target_std at 3000 and target_var at 4e7, versus ~1 on a healthy batch).
# Under MSE such a batch outweighs millions of normal batches. The JEPA arm
# is unaffected because its targets are encoder outputs kept O(1) by
# LayerNorm. Huber bounds each element's contribution and keeps all windows,
# so both arms see the same data; `train_loss/target_absmax` keeps the
# amplitude visible. The arm therefore differs from JEPA in the shape of the
# loss as well as in the target space.
#
# The comparison only holds if both arms are evaluated with the same finetune
# and the same protocol: lotsa_tiny_zeroshot then lotsa_tiny_eval. The
# pretrain `val_loss` is not comparable between the arms (latent space vs
# value space); only the post-finetune MASE/WQL compare. Effective rank stays
# logged but its calibration does not apply here, since raw targets are fixed
# and cannot collapse.
defaults:
  - lotsa_tiny
  - _self_

model:
  name: "timejepa_lotsa_tiny_recon"

training:
  # The only flag distinguishing this arm; absent from every other config.
  reconstruction_target: true

  loss:
    # `_compute_loss` bypasses `jepa_loss` in reconstruction mode and applies
    # a bare Huber: the anti-collapse terms exist because latent targets are
    # learned and can degenerate, which raw patches cannot. This line drives
    # nothing; it keeps the startup log (which prints `loss_type`) from
    # suggesting SIGReg is still running.
    type: "smooth_l1"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "pretrain"
    - "ablation-objectif"
