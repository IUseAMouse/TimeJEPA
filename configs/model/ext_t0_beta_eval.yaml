# @package _global_
# t0-beta (The Forecasting Company, 256M, open weights) through the GIFT harness
# (2026-10-05, RateIN on third-party models). Needs tfc-t0 >= 0.5: older releases
# run it under t0-alpha's normalization. Same commands as ext_chronos_bolt_tiny_eval.
model:
  name: "t0_beta"
  builder: "timejepa.evaluation.external:build"
  external:
    kind: "t0"
    hf_id: "theforecastingcompany/t0-beta"
    context_length: 2048
  seq_length: 2048
