# configs/model/jepa.yaml
model:
  name: "timejepa"
  
  # Architecture - TO BE UPDATED AFTER compute_model_config.py
  # Current baseline (will be adjusted based on dataset size D)
  d_model: 256  # Update to 384 if D > 20M
  num_layers: 8  # Update to 6 if D < 30M (over-parameterized risk)
  num_heads: 8  # Should divide d_model
  d_ff: 1024  # 4 * d_model (will auto-update)
  patch_size: 16
  
  # Sequence lengths
  max_context_length: 512
  max_prediction_length: 96
  
  # RevIN (Reversible Instance Normalization)
  use_revin: true
  
  # RoPE (Rotary Position Embedding)
  use_rope: true
  max_position: 1024  # For extrapolation beyond training lengths
  
  # JEPA components
  encoder:
    type: "patchtst_encoder"
    dropout: 0.1
  
  target_encoder:
    type: "patchtst_encoder"
    share_weights: false  # Separate weights, updated via EMA
    ema_decay: 0.996  # Exponential moving average decay
    dropout: 0.1
  
  predictor:
    type: "transformer"
    num_layers: 4  # Lighter than encoder (JEPA principle)
    dropout: 0.1
  
  decoder:
    type: "linear"  # Simple projection for inference
    enabled_at_inference: true