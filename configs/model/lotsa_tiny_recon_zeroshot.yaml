# @package _global_
#
# Zero-shot finetune of the reconstruction arm.
#
#   python scripts/train.py --config-name lotsa_tiny_recon_zeroshot \
#       +training.pretrained_encoder_path=checkpoints/timejepa_lotsa_tiny_recon/pretrain_True/<ckpt> \
#       wandb.run_name=recon-zeroshot
#
# This config only changes a name: `scripts/train.py` derives the checkpoint
# directory from `model.name` (checkpoints/{model.name}/pretrain_{True|False}/).
# Finetuning both arms with `lotsa_tiny_zeroshot` would mix their checkpoints
# in one directory, with no way at evaluation to know which pretrain the
# loaded weights come from. Nothing else is redeclared: the finetune protocol
# must stay that of the JEPA arm.
defaults:
  - lotsa_tiny_zeroshot
  - _self_

model:
  name: "timejepa_lotsa_tiny_recon_zs"

wandb:
  tags:
    - "tiny"
    - "jepa_tst"
    - "experiment"
    - "lotsa"
    - "finetune"
    - "ablation-objectif"
