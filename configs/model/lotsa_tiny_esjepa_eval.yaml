# @package _global_
# Eval of the ESJEPA checkpoints (GIFT / Nixtla).
#
#   python scripts/evaluate_gift.py --config-name lotsa_tiny_esjepa_eval \
#       '+checkpoint_path="checkpoints/timejepa_lotsa_tiny_esjepa_zs/pretrain_False/<ckpt>"'
#
# error_signal must be carried here (as in lotsa_tiny_xres_eval): the z head
# is a predictor weight (predictor.z_head.*), and without the flag the model
# lacks the keys and loading refuses the checkpoint. robust_scale is
# inherited from lotsa_tiny_mix_eval.
defaults:
  - lotsa_tiny_mix_eval
  - _self_

model:
  name: "timejepa_lotsa_tiny_esjepa_zs"
  error_signal: true

wandb:
  tags: ["tiny", "jepa_tst", "experiment", "lotsa", "zeroshot", "eval", "error-signal", "robust-scale"]
