# Main configuration file for TimeJEPA
# Use with Hydra: python scripts/train.py model=base training=pretrain

defaults:
  - model: base
  - training: pretrain
  - data: default
  - _self_

# Experiment name
name: "jepa_experiment"

# Paths
paths:
  data_dir: "data/"
  output_dir: "outputs/"
  log_dir: "logs/"
  checkpoint_dir: "checkpoints/"

# Random seed for reproducibility
seed: 42

# MLflow configuration
mlflow:
  tracking_uri: "mlruns"  # Local MLflow directory
  experiment_name: "TimeJEPA"
  run_name: null  # Auto-generated if null
  tags:
    project: "TimeJEPA"
    framework: "PyTorch Lightning"
  log_model: true
  log_artifacts: true
  log_system_metrics: true

# PyTorch Lightning Trainer
trainer:
  accelerator: "auto"
  devices: 1
  precision: "16-mixed"  # Mixed precision training
  max_epochs: 100
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  log_every_n_steps: 50
  enable_checkpointing: true
  enable_progress_bar: true
  enable_model_summary: true
  deterministic: false  # Set to true for full reproducibility (slower)
  
# Checkpointing
checkpoint:
  monitor: "val/loss"
  mode: "min"
  save_top_k: 3
  save_last: true
  filename: "epoch={epoch:02d}-val_loss={val/loss:.4f}"
  auto_insert_metric_name: false

# Early stopping
early_stopping:
  enabled: false
  monitor: "val/loss"
  patience: 15
  mode: "min"
  min_delta: 0.0001