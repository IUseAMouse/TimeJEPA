datasets:
  # Tes datasets actuels
  electricity:
    url: "https://zenodo.org/record/4656140/files/electricity_hourly_dataset.zip?download=1"
    description: "Electricity consumption hourly - 321 series"
    expected_files: ["*.ts", "*.tsf"]
    frequency: "hourly"
    
  traffic:
    url: "https://zenodo.org/records/5129091/files/temperature_rain_dataset_without_missing_values.zip?download=1"
    description: "Traffic hourly data"
    expected_files: ["*.ts", "*.tsf"]
    frequency: "hourly"
    
  weather:
    url: "https://zenodo.org/records/5184708/files/oikolab_weather_dataset.zip?download=1"
    description: "Weather dataset"
    expected_files: ["*.ts", "*.tsf"]
    frequency: "hourly"
  
  # Datasets additionnels recommandés
  m4_hourly:
    url: "https://zenodo.org/records/4656589/files/m4_hourly_dataset.zip?download=1"
    description: "M4 competition hourly - 414 series"
    expected_files: ["*.ts", "*.tsf"]
    frequency: "hourly"
    
  australian-electricity-demand:
    url: "https://zenodo.org/records/4659727/files/australian_electricity_demand_dataset.zip?download=1"
    description: "Australian electricity demand - 5 series"
    expected_files: ["*.ts", "*.tsf"]
    frequency: "half-hourly"

  web-traffic-extended:
    url: "https://zenodo.org/records/7371038/files/web_traffic_extended_dataset_without_missing_values.zip?download=1"
    description: "Extended web traffic on wikepedia from 2015-07-01 to 2022-06-30 - 145063 time series"
    expected_files: ["*.tsf"]
    frequency: "faily"

  rideshare:
    url: "https://zenodo.org/records/5122232/files/rideshare_dataset_without_missing_values.zip?download=1"
    description: "Rideshare data - Unknown number of series"
    expected_files: ["*.tsf"]
    frequency: ["hourly"]


download:
  chunk_size: 8192
  timeout: 300
  max_retries: 3
  retry_delay: 5